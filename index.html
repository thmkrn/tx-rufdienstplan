<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Thoraxorgane – Rufdienstplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AB%80%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>








      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F0EEE7;
        --panel: #FBFAF6;
        --ink: #20262F;
        --muted: #766F62;
        --line: #DAD5C8;
        --heart: #B23A32;
        --lung: #3E7C8A;
        --green: #4C7A52;
        --green-bg: #E4EDE3;
        --amber: #B4791F;
        --amber-bg: #F3E5C7;
        --surface: #FFFFFF;
        --bad-bg: #F5DCD9;
        --amber-text: #8A4D10;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1B1F26;
          --panel: #23282F;
          --ink: #EDEAE2;
          --muted: #9A9384;
          --line: #3A3F47;
          --heart: #E0766D;
          --lung: #6FB0BE;
          --green: #7FB98A;
          --green-bg: #223327;
          --amber: #E0AC55;
          --amber-bg: #3A2F17;
          --surface: #2A2F37;
          --bad-bg: #4A2622;
          --amber-text: #F0C98A;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1B1F26;
        --panel: #23282F;
        --ink: #EDEAE2;
        --muted: #9A9384;
        --line: #3A3F47;
        --heart: #E0766D;
        --lung: #6FB0BE;
        --green: #7FB98A;
        --green-bg: #223327;
        --amber: #E0AC55;
        --amber-bg: #3A2F17;
        --surface: #2A2F37;
        --bad-bg: #4A2622;
        --amber-text: #F0C98A;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }
      * , *::before, *::after { box-sizing: border-box; }
      .tx-app {
        font-family: 'Inter', sans-serif;
        color: var(--ink);
        background: var(--bg);
        min-height: 100vh;
        width: 100%;
      }

      .login-screen {
        min-height: 480px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 36px 32px;
        text-align: center;
        max-width: 320px;
        width: 100%;
      }
      .login-title {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 22px;
        margin: 14px 0 2px;
      }
      .login-sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
      .login-oncall-preview {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 12px 14px;
        margin-bottom: 20px;
      }
      .login-oncall-label { font-size: 11px; color: var(--muted); }
      .login-oncall-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin-top: 2px; }
      .login-oncall-none { color: var(--muted); font-size: 16px; }
      .login-oncall-lead { font-size: 12px; color: var(--amber-text); font-weight: 600; margin-top: 4px; }
      .login-oncall-backup { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .login-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 3px;
        font-size: 15px;
        font-family: inherit;
        background: var(--surface);
        color: var(--ink);
      }
      .login-error { color: var(--heart); font-size: 13px; margin: 8px 0 0; }
      .login-btn { width: 100%; margin-top: 14px; }
      .loading-text { color: var(--muted); }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
        border: none;
        border-radius: 3px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      .btn-primary { background: var(--heart); color: #fff; }
      .btn-primary:hover { background: #9c332c; }
      .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
      .btn-call {
        background: var(--green);
        color: #fff;
        text-decoration: none;
        margin-top: 10px;
      }

      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .header-brand { display: flex; align-items: center; gap: 12px; }
      .logo-emoji { display: inline-flex; align-items: center; }
      .lock-btn { font-size: 12px; padding: 6px 10px; white-space: nowrap; }
      .brand-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; line-height: 1.2; }
      .brand-sub { font-size: 12px; color: var(--muted); }

      .tab-nav { display: flex; gap: 4px; flex-wrap: wrap; }
      .tab-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 7px 13px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 500;
        border-radius: 3px;
        cursor: pointer;
      }
      .tab-btn.active { background: var(--heart); color: #fff; border-color: var(--heart); }

      .app-main { padding: 18px 20px 40px; max-width: 900px; margin: 0 auto; }
      .tab-content { display: flex; flex-direction: column; gap: 14px; }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 14px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 16px;
      }
      .field-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .person-picker { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
      .select, .text-input {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        font-size: 14px;
        font-family: inherit;
        background: var(--surface);
        color: var(--ink);
        min-width: 190px;
      }

      .hint-text { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }

      .month-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .nav-btn {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 6px;
        cursor: pointer;
        color: var(--ink);
        display: flex;
      }
      .month-label { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; min-width: 150px; text-align: center; }

      .cal-grid { display: flex; flex-direction: column; gap: 4px; }
      .cal-week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-header-row { margin-bottom: 2px; }
      .cal-weekday { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 0; }
      .cal-cell-wrap { min-width: 0; }

      .cell {
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid transparent;
        border-radius: 3px;
        min-height: 68px;
        padding: 5px 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        cursor: pointer;
        user-select: none;
        position: relative;
      }
      .cell-readonly { cursor: default; }
      .cell-disabled { cursor: not-allowed; opacity: 0.7; }
      .cell-out { opacity: 0.38; }
      .cell-today { box-shadow: 0 0 0 2px var(--ink) inset; }
      .cell-leadwarn { border-style: dashed; border-color: var(--amber); border-width: 1px; }
      .cell.status-verfuegbar { background: var(--green-bg); }
      .cell.status-vielleicht { background: var(--amber-bg); }

      .cell-top { display: flex; align-items: center; justify-content: space-between; }
      .cell-daynum { font-size: 12px; font-weight: 600; color: var(--ink); }
      .today-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.03em; color: var(--heart); }

      .cell-top-buttons { display: flex; align-items: center; gap: 2px; }
      .lead-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 1px;
        display: flex;
      }
      .lead-btn:hover { color: var(--amber); }
      .note-btn {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 50%;
        width: 14px;
        height: 14px;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .note-btn:hover { color: var(--heart); border-color: var(--heart); }
      .cell-notewarn { border-style: dashed; border-color: var(--heart); border-width: 1px; }
      .note-tag { font-size: 9px; color: var(--heart); font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
      .admin-note-dot { font-size: 8px; }
      .today-notewarn { font-size: 13px; color: var(--heart); font-weight: 600; margin-top: 4px; }

      .status-pill { font-size: 10px; font-weight: 600; }
      .status-verfuegbar .status-pill { color: var(--green); }
      .status-vielleicht .status-pill { color: var(--amber); }
      .leadtime-tag { font-size: 9px; color: var(--amber); font-weight: 600; }
      .cell-scheduled { box-shadow: 0 0 0 2px var(--heart) inset; }
      .scheduled-tag { display: block; font-size: 9px; font-weight: 700; color: var(--heart); }
      .scheduled-tag-backup { color: var(--amber-text); }

      .ical-subscribe-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ical-subscribe-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; margin: 0; }
      .ical-url-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .ical-url-input { flex: 1; min-width: 220px; font-size: 12px; }

      .assigned-name { font-size: 11px; font-weight: 600; line-height: 1.2; }

      .legend-row { display: flex; flex-wrap: wrap; gap: 12px; }
      .legend-chip { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
      .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .legend-dot-verf { background: var(--green); }
      .legend-dot-viell { background: var(--amber); }

      .ref-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
      .ref-table { border-collapse: collapse; font-size: 11px; width: 100%; }
      .ref-table th, .ref-table td { padding: 4px 5px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
      .ref-corner { min-width: 90px; }
      .ref-name { text-align: left; font-weight: 600; }
      .ref-cell { width: 18px; height: 18px; }
      .ref-cell.ref-verfuegbar { background: var(--green); }
      .ref-cell.ref-vielleicht { background: var(--amber); }
      .ref-cell.ref-lead { box-shadow: inset 0 0 0 2px var(--heart); }

      .today-banner {
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 5px;
        padding: 18px 20px;
        text-align: center;
      }
      .today-date { font-size: 12px; color: var(--muted); }
      .today-label { font-size: 12px; text-transform: none; color: var(--muted); margin-top: 2px; }
      .today-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; margin-top: 4px; }
      .today-none { color: var(--muted); font-size: 20px; }
      .today-leadwarn { font-size: 13px; color: var(--amber); font-weight: 600; margin-top: 6px; }
      .no-phone-note { font-size: 12px; color: var(--muted); margin-top: 10px; }

      .stats-table-wrap { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); overflow-x: auto; }
      .stats-table { border-collapse: collapse; width: 100%; font-size: 14px; }
      .stats-table th, .stats-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
      .stats-table th { font-size: 11px; color: var(--muted); font-weight: 600; }

      .reset-btn { align-self: flex-start; }

      .mat-summary { padding: 10px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; }
      .mat-summary-ok { background: var(--green-bg); color: var(--green); }
      .mat-summary-warn { background: var(--amber-bg); color: var(--amber-text); }

      .mat-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
      .mat-filter-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

      .mat-list { display: flex; flex-direction: column; gap: 6px; }
      .mat-row { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
      .mat-row-main {
        display: grid;
        grid-template-columns: auto 1fr auto auto auto;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
      }
      .mat-name { font-weight: 600; font-size: 14px; }
      .mat-ref { font-size: 11px; color: var(--muted); margin-top: 1px; }
      .mat-qty-badge, .mat-expiry-badge {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 20px;
        white-space: nowrap;
        background: var(--bg);
        color: var(--muted);
      }
      .mat-badge-ok { background: var(--green-bg); color: var(--green); }
      .mat-badge-warn { background: var(--amber-bg); color: var(--amber-text); }
      .mat-badge-bad { background: var(--bad-bg); color: var(--heart); }

      .mat-detail { padding: 4px 14px 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
      .mat-batch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .mat-batch-table th, .mat-batch-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
      .mat-batch-expired { background: var(--bad-bg); }
      .mat-batch-soon { background: var(--amber-bg); }

      .mat-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .mat-min-edit { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .mat-num-input { min-width: 70px; width: 80px; }
      .mini-btn { background: transparent; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 2px 7px; font-size: 12px; color: var(--muted); }
      .mini-btn:hover { color: var(--heart); border-color: var(--heart); }
      .mat-delete { color: var(--heart); border-color: var(--heart); margin-left: auto; }

      .inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; }

      /* ---- Admin: Zuweisungsmatrix ---- */
      .assign-badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
      .assign-table th, .assign-table td { padding: 3px 4px; }
      .assign-monday-col { border-left: 2px solid var(--muted); }
      .assign-cell {
        min-width: 26px;
        height: 28px;
        cursor: default;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
        color: var(--ink);
      }
      .assign-cell-clickable { cursor: pointer; }
      .assign-cell-clickable:hover { outline: 2px solid var(--lung); outline-offset: -2px; }
      .assign-cell-primary { box-shadow: inset 0 0 0 2px var(--green); }
      .assign-cell-backup { box-shadow: inset 0 0 0 2px var(--amber); }
      .assign-name-text { font-size: 11px; font-weight: 600; padding: 0 3px; }
      .assign-role-tag {
        display: inline-block;
        margin-left: 3px;
        font-size: 9px;
        font-weight: 800;
        padding: 1px 5px;
        border-radius: 8px;
        color: #fff;
        vertical-align: middle;
      }
      .assign-role-primary { background: var(--green); }
      .assign-role-backup { background: var(--amber); }

      .assigned-backup { font-size: 10px; font-weight: 600; opacity: 0.85; }
      .today-backup-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
      .today-backup-label { font-size: 11px; color: var(--muted); text-transform: none; }
      .today-backup-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; }
      .btn-call-backup { margin-top: 6px; }

      /* ---- Material: Steuerzeile, Bild, Name, Verwendung ---- */
      .mat-controls-right { display: flex; gap: 8px; flex-wrap: wrap; }
      .mat-thumb { width: 32px; height: 32px; border-radius: 3px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; }
      .mat-thumb-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); background: var(--bg); }
      .mat-thumb-lg { width: 84px; height: 84px; border-radius: 4px; object-fit: cover; border: 1px solid var(--line); flex-shrink: 0; }
      .mat-usage-badge { font-size: 10px; font-weight: 600; color: var(--lung); border: 1px solid var(--lung); border-radius: 20px; padding: 2px 8px; white-space: nowrap; }

      .mat-editrow { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
      .mat-image-edit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .mat-image-actions { display: flex; gap: 6px; align-items: center; }
      .mat-upload-label { position: relative; cursor: pointer; font-size: 11px; padding: 5px 9px; overflow: visible; }
      .mat-file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 2; }
      .mat-name-edit-block { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
      .mat-name-edit-btn { background: transparent; border: none; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 0; }
      .mat-name-edit-btn:hover { color: var(--ink); }
      .mat-usage-picker { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .usage-btn { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--muted); cursor: pointer; }
      .usage-btn-active { background: var(--lung); border-color: var(--lung); color: #fff; }

      /* ---- Tab: Im Einsatz ---- */
      .organ-picker { display: flex; gap: 8px; margin-top: 4px; }
      .organ-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 18px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
      .organ-btn-active { background: var(--heart); border-color: var(--heart); color: #fff; }

      .einsatz-section { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      .einsatz-section-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; margin: 0 0 2px; }
      .einsatz-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
      .einsatz-item:last-child { border-bottom: none; }
      .einsatz-item-main { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
      .einsatz-item-label { font-weight: 500; }
      .einsatz-status-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
      .einsatz-status-packed { background: var(--amber-bg); color: var(--amber-text); }
      .einsatz-status-consumed { background: var(--green-bg); color: var(--green); }
      .einsatz-item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
      .einsatz-linked { white-space: nowrap; }
      .einsatz-linked-empty { color: var(--heart); font-weight: 700; }
      .einsatz-unlinked { font-style: italic; opacity: 0.7; }
      .einsatz-qty { font-weight: 600; }
      .einsatz-qty-input { width: 60px; }
      .einsatz-variant-select, .einsatz-link-select { font-size: 12px; padding: 4px 6px; }
      .einsatz-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

      .stats-date-input { width: 140px; }
      .stats-total-cell { font-weight: 700; }

      @media (max-width: 560px) {
        .cell { min-height: 54px; padding: 4px; }
        .cell-daynum { font-size: 11px; }
        .assigned-name { font-size: 10px; }
        .app-main { padding: 14px 10px 32px; }
        .today-name { font-size: 24px; }
        .mat-row-main { grid-template-columns: 1fr; }
        .mat-editrow { flex-direction: column; }

function pad(n) { return String(n).padStart(2, "0"); }
function dstr(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function parseDstr(s) { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; }
function toDate(s) { const { y, m, d } = parseDstr(s); return new Date(y, m, d); }

function addDaysStr(dateStr, n) {
  const dt = toDate(dateStr);

}

function weekFromMonday(mondayStr) {
  const dt = toDate(mondayStr);
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(dt); d.setDate(d.getDate() + i);
    out.push(dstr(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  return out;
}

function buildMonthGrid(year, month) {
  const first = new Date(year, month, 1);
  const firstDow = (first.getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - firstDow);
  const weeks = [];
  const cur = new Date(gridStart);
  for (let w = 0; w < 6; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      week.push(dstr(cur.getFullYear(), cur.getMonth(), cur.getDate()));
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(week);
  }
  return weeks;
}

function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}
function addD(dt, n) { const d = new Date(dt); d.setDate(d.getDate() + n); return d; }
function shHolidays(year) {
  const easter = easterDate(year);
  const set = new Set();
  const push = (dt) => set.add(dstr(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  push(new Date(year, 0, 1));
  push(addD(easter, -2));
  push(addD(easter, 1));
  push(new Date(year, 4, 1));
  push(addD(easter, 39));
  push(addD(easter, 50));
  push(new Date(year, 9, 3));
  push(new Date(year, 9, 31));
  push(new Date(year, 11, 25));
  push(new Date(year, 11, 26));
  return set;
}

function daysUntil(dateStr) {
  const d = toDate(dateStr);
  const t = new Date(); t.setHours(0, 0, 0, 0);

}

function materialTotalQty(mat) {
  return (mat.batches || []).reduce((sum, b) => sum + (b.qty || 0), 0);

function materialSoonestExpiry(mat) {
  const withExpiry = (mat.batches || []).filter((b) => b.expiry).sort((a, b) => a.expiry.localeCompare(b.expiry));
  return withExpiry.length ? withExpiry[0].expiry : null;
}

function materialStatus(mat) {
  const total = materialTotalQty(mat);
  const understock = mat.minQty > 0 && total < mat.minQty;
  const soonest = materialSoonestExpiry(mat);

  if (soonest) {
    const du = daysUntil(soonest);
    if (du < 0) expiryState = "expired";
    else if (du <= EXPIRY_WARNING_DAYS) expiryState = "soon";
  }
  return { total, understock, soonest, expiryState };
}

function colorFor(members, id) {

function shortMemberName(members, member) {
  const first = member.name.split(" ")[0];
  const sameFirst = members.filter((m) => m.name.split(" ")[0] === first);
  if (sameFirst.length <= 1) return first;
  const rest = member.name.slice(first.length).trim();
  for (let len = 1; len <= rest.length; len++) {
    const candidate = first + " " + rest.slice(0, len) + ".";
    const collision = sameFirst.some((m) => {
      if (m.id === member.id) return false;
      const r2 = m.name.slice(m.name.split(" ")[0].length).trim();
      return r2.slice(0, len).toLowerCase() === rest.slice(0, len).toLowerCase();
    });
    if (!collision) return candidate;
  }
  return member.name;
}

function availablePeopleForDay(data, dateStr) {
  const list = [];
  data.members.forEach((member) => {
    const e = (data.availability[member.id] || {})[dateStr];
    if (e && (e.status === "verfuegbar" || e.status === "vielleicht")) {
      list.push({ member, status: e.status, hasLeadTime: !!e.leadTimeHours, note: e.note || null });
    }
  });
  // Bereits zugewiesene Personen immer mit anzeigen, auch falls die Verfügbarkeit
  // nachträglich entfernt wurde (damit die Zuweisung sichtbar bleibt und man sie
  // wieder entfernen kann).
  const primaryId = data.assignments[dateStr];
  const backupId = (data.backupAssignments || {})[dateStr];
  [primaryId, backupId].forEach((pid) => {
    if (pid && !list.find((x) => x.member.id === pid)) {
      const m = data.members.find((x) => x.id === pid);
      if (m) list.push({ member: m, status: null, hasLeadTime: false, note: null });
    }
  });
  return list;
}

function resizeImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lesefehler"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Bildfehler"));
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.65));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function asciiSafe(s) {

  y += 9;

  const colX = [marginX, marginX + 68, marginX + 100, marginX + 118, marginX + 140, marginX + 168];
  doc.setFontSize(10);
  doc.setFont("helvetica", "bold");
  ["Artikel", "Verwendung", "Bestand", "Mind.", "MHD", "Status"].forEach((h, i) => doc.text(h, colX[i], y));
  doc.setFont("helvetica", "normal");
  y += 2;
  doc.line(marginX, y, 196, y);
  y += 5;

  materials.forEach((m) => {
    try {
      const status = materialStatus(m);
      if (y > 280) { doc.addPage(); y = 18; }
      doc.setFontSize(8.5);
      doc.text(asciiSafe(m.name || "-").slice(0, 40), colX[0], y);
      doc.text(asciiSafe(USAGE_LABELS[m.usage] || "-"), colX[1], y);
      doc.text(String(status.total), colX[2], y);
      doc.text(String(m.minQty || 0), colX[3], y);
      doc.text(status.soonest || "-", colX[4], y);
      let statusLabel = "OK";
      if (status.understock) statusLabel = "Nachbestellen";
      else if (status.expiryState === "expired") statusLabel = "Abgelaufen";
      else if (status.expiryState === "soon") statusLabel = "Laeuft bald ab";
      doc.text(statusLabel, colX[5], y);
      y += 6;
    } catch (rowErr) {
      console.error("PDF-Zeile uebersprungen wegen Fehler", m, rowErr);
    }
  });

  return doc.output("blob");
}

function icsEscape(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}
function icsDateFmt(dateStr) { return dateStr.replace(/-/g, ""); }

function icsSubscribeUrl(person) {
  if (!person) return "";
  return window.location.origin + "/api/ical?person=" + encodeURIComponent(person.id) + "&token=" + encodeURIComponent(person.calendarToken || "");
}

function buildPersonIcs(data, personId) {
  const understocked = data.materials.filter((m) => materialStatus(m).understock);
  const warningLine = understocked.length > 0
    ? "ACHTUNG: " + understocked.length + " Material(ien) aktuell unter Mindestmenge (" + understocked.map((m) => m.name).join(", ") + "). Bitte Material-Tab pruefen."
    : "";

  const primaryDates = Object.entries(data.assignments || {}).filter(([, pid]) => pid === personId).map(([ds]) => ds).sort();
  const backupDates = Object.entries(data.backupAssignments || {}).filter(([, pid]) => pid === personId).map(([ds]) => ds).sort();

  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Team Thoraxorgane//Rufdienstplan//DE", "CALSCALE:GREGORIAN"];

  function addEvent(dateStr, summary) {
    const nextDay = addDaysStr(dateStr, 1);
    lines.push("BEGIN:VEVENT");
    lines.push("UID:" + dateStr + "-" + personId + "-" + summary.replace(/\s+/g, "") + "@rufdienstplan.thoraxorgane");
    lines.push("DTSTAMP:" + icsDateFmt(todayStr()) + "T000000Z");
    lines.push("DTSTART;VALUE=DATE:" + icsDateFmt(dateStr));
    lines.push("DTEND;VALUE=DATE:" + icsDateFmt(nextDay));
    lines.push("SUMMARY:" + icsEscape(summary));
    lines.push("DESCRIPTION:" + icsEscape(warningLine || "Rufdienst Team Thoraxorgane"));
    lines.push("END:VEVENT");
  }

  primaryDates.forEach((ds) => addEvent(ds, "Rufdienst"));
  backupDates.forEach((ds) => addEvent(ds, "Rufdienst (Backup)"));

  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

/* ---------- Hauptkomponente ---------- */

function App() {
  const [unlocked, setUnlocked] = useState(false);
  const [pwInput, setPwInput] = useState("");
  const [pwError, setPwError] = useState(false);

  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const saveTimer = useRef(null);
  const clickTimers = useRef({});

  const [tab, setTab] = useState("uebersicht");
  const now = new Date();
  const [viewYear, setViewYear] = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth());
  const [statYear, setStatYear] = useState(now.getFullYear());

  const [currentPerson, setCurrentPerson] = useState("");

  const [einsatz, setEinsatz] = useState(defaultEinsatz());
  const [materialImages, setMaterialImages] = useState({});

  const localChangeFlag = useRef(false);
  const einsatzChangeFlag = useRef(false);
  const einsatzSaveTimer = useRef(null);

  function commit(updater) {
    localChangeFlag.current = true;
    setData(updater);
  }

  function normalizeData(remote) {
    let changed = false;
    if (!remote.materials) { remote.materials = MATERIALS_SEED.map((m) => ({ ...m, batches: [] })); changed = true; }
    remote.materials = remote.materials.map((m) => ({ usage: m.usage || null, ...m }));
    if (!remote.members) {
      remote.members = MEMBERS_BASE.map((m) => ({ id: m.id, name: m.name, phone: "", color: m.color, calendarToken: generateToken() }));
      changed = true;
    } else {
      remote.members = remote.members.map((m) => {
        const base = MEMBERS_BASE.find((b) => b.id === m.id);
        const color = m.color || (base && base.color) || "#8B8578";
        const calendarToken = m.calendarToken || generateToken();
        if (color !== m.color || calendarToken !== m.calendarToken) changed = true;
        return { ...m, color, calendarToken };
      });
    }
    if (!remote.backupAssignments) { remote.backupAssignments = {}; changed = true; }
    if (!remote.checklists) { remote.checklists = JSON.parse(JSON.stringify(CHECKLISTS_SEED)); changed = true; }
    if (!remote.statsBaseline) { remote.statsBaseline = {}; changed = true; }
    return { data: remote, changed };
  }

  // Initiales Laden von app/state
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await apiGetDoc("app/state");
        if (cancelled) return;
        if (res.exists) {
          const { data: normalized, changed } = normalizeData(res.data);
          setData(normalized);
          if (changed) apiSetDoc("app/state", normalized).catch((e) => console.error("Backfill speichern fehlgeschlagen", e));
        } else {
          setData(defaultData());
        }
      } catch (e) {
        console.error("Laden fehlgeschlagen", e);
        if (!cancelled) setData(defaultData());
      }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, []);

  // Regelmäßiges Nachladen von app/state (Live-Sync per Polling, überschreibt keine lokal
  // noch ungespeicherten Änderungen)
  useEffect(() => {
    const interval = setInterval(async () => {
      if (localChangeFlag.current) return;
      try {
        const res = await apiGetDoc("app/state");
        if (res.exists) {
          const { data: normalized, changed } = normalizeData(res.data);
          setData(normalized);
          if (changed) apiSetDoc("app/state", normalized).catch((e) => console.error("Backfill speichern fehlgeschlagen", e));
        }
      } catch (e) { console.error("Sync fehlgeschlagen", e); }
    }, SYNC_POLL_MS);
    return () => clearInterval(interval);
  }, []);

  // Speichern von app/state bei lokalen Änderungen (debounced)
  useEffect(() => {
    if (loading || !data) return;
    if (!localChangeFlag.current) return;
    localChangeFlag.current = false;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      apiSetDoc("app/state", data).catch((e) => console.error("Speichern fehlgeschlagen", e));
    }, 400);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [data, loading]);

  // Material-Bilder laden + regelmäßig aktualisieren
  useEffect(() => {
    let cancelled = false;
    async function loadImages() {
      try {
        const res = await apiGetCollection("materials");
        if (cancelled) return;
        const images = {};
        (res.docs || []).forEach((d) => { if (d.data && d.data.imageDataUrl) images[d.id] = d.data.imageDataUrl; });
        setMaterialImages(images);
      } catch (e) { console.error("Bild-Sync fehlgeschlagen", e); }
    }
    loadImages();
    const interval = setInterval(loadImages, SYNC_POLL_MS + 2000);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  // Einsatz-Dokument laden + regelmäßig aktualisieren
  useEffect(() => {
    let cancelled = false;
    async function loadEinsatz() {
      if (einsatzChangeFlag.current) return;
      try {
        const res = await apiGetDoc("einsatz/current");
        if (cancelled) return;
        setEinsatz(res.exists ? { organ: res.data.organ || null, itemStatus: res.data.itemStatus || {} } : defaultEinsatz());
      } catch (e) { console.error("Einsatz-Sync fehlgeschlagen", e); }
    }
    loadEinsatz();
    const interval = setInterval(loadEinsatz, SYNC_POLL_MS);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  function commitEinsatz(updater) {
    einsatzChangeFlag.current = true;
    setEinsatz(updater);
  }

  useEffect(() => {
    if (!einsatzChangeFlag.current) return;
    einsatzChangeFlag.current = false;
    if (einsatzSaveTimer.current) clearTimeout(einsatzSaveTimer.current);
    einsatzSaveTimer.current = setTimeout(() => {
      apiSetDoc("einsatz/current", einsatz).catch((e) => console.error("Einsatz speichern fehlgeschlagen", e));
    }, 300);
    return () => { if (einsatzSaveTimer.current) clearTimeout(einsatzSaveTimer.current); };
  }, [einsatz]);

  /* ---------- Mutationen ---------- */

  function setAvailabilityDay(personId, dateStr, status) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const personAvail = { ...(availability[personId] || {}) };
      if (status === null) {
        delete personAvail[dateStr];
      } else {
        personAvail[dateStr] = { ...(personAvail[dateStr] || {}), status };
      }
      availability[personId] = personAvail;
      return { ...prev, availability };
    });
  }

  function setWeekAvailable(personId, mondayStr) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const personAvail = { ...(availability[personId] || {}) };
      weekFromMonday(mondayStr).forEach((ds) => {
        personAvail[ds] = { ...(personAvail[ds] || {}), status: "verfuegbar" };
      });
      availability[personId] = personAvail;
      return { ...prev, availability };
    });
  }

  function setLeadTime(personId, dateStr, hours) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const personAvail = { ...(availability[personId] || {}) };
      const entry = { ...(personAvail[dateStr] || {}) };
      if (hours === null) delete entry.leadTimeHours;
      else entry.leadTimeHours = hours;
      if (!entry.status && !entry.leadTimeHours && !entry.note) delete personAvail[dateStr];
      else personAvail[dateStr] = entry;
      availability[personId] = personAvail;
      return { ...prev, availability };
    });
  }

  function setNote(personId, dateStr, note) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const personAvail = { ...(availability[personId] || {}) };
      const entry = { ...(personAvail[dateStr] || {}) };
      if (!note) delete entry.note;
      else entry.note = note;
      if (!entry.status && !entry.leadTimeHours && !entry.note) delete personAvail[dateStr];
      else personAvail[dateStr] = entry;
      availability[personId] = personAvail;
      return { ...prev, availability };
    });
  }

  function updatePhone(personId, phone) {
    commit((prev) => ({
      ...prev,
      members: prev.members.map((m) => (m.id === personId ? { ...m, phone } : m)),
    }));
  }

  function updateMemberName(personId, name) {
    commit((prev) => ({
      ...prev,
      members: prev.members.map((m) => (m.id === personId ? { ...m, name } : m)),
    }));
  }

  function updateMemberColor(personId, color) {
    commit((prev) => ({
      ...prev,
      members: prev.members.map((m) => (m.id === personId ? { ...m, color } : m)),
    }));
  }

  function updateStatsBaseline(personId, patch) {
    commit((prev) => {
      const statsBaseline = { ...(prev.statsBaseline || {}) };
      statsBaseline[personId] = { ...(statsBaseline[personId] || { count: 0, asOf: "" }), ...patch };
      return { ...prev, statsBaseline };
    });
  }

  function handleAvailClick(personId, dateStr) {
    if (!personId) return;
    if (clickTimers.current[dateStr]) {
      clearTimeout(clickTimers.current[dateStr]);
      delete clickTimers.current[dateStr];
      return;
    }
    clickTimers.current[dateStr] = setTimeout(() => {
      delete clickTimers.current[dateStr];
      if (dowMon0(dateStr) === 0) {
        setWeekAvailable(personId, dateStr);
      } else {
        commit((prev) => {
          const availability = { ...prev.availability };
          const personAvail = { ...(availability[personId] || {}) };
          const cur = personAvail[dateStr];
          const curStatus = cur ? cur.status : null;
          const nextStatus = curStatus === "verfuegbar" ? "vielleicht" : curStatus === "vielleicht" ? null : "verfuegbar";
          if (nextStatus === null) {
            delete personAvail[dateStr];
          } else {
            personAvail[dateStr] = { ...(cur || {}), status: nextStatus };
          }
          availability[personId] = personAvail;
          return { ...prev, availability };
        });
      }
    }, 260);
  }

  function handleAvailDoubleClick(personId, dateStr) {
    if (!personId) return;
    if (clickTimers.current[dateStr]) {
      clearTimeout(clickTimers.current[dateStr]);
      delete clickTimers.current[dateStr];
    }
    setAvailabilityDay(personId, dateStr, null);
  }

  function handleLeadTimeClick(personId, dateStr) {
    if (!personId) return;
    const cur = (data.availability[personId] || {})[dateStr];
    const curVal = cur && cur.leadTimeHours ? String(cur.leadTimeHours) : "";
    const input = window.prompt(`Vorlaufzeit für ${dateStr} in Stunden.\nLeer lassen oder 0 zum Entfernen.`, curVal);
    if (input === null) return;
    const trimmed = input.trim();
    if (trimmed === "") { setLeadTime(personId, dateStr, null); return; }
    const num = Number(trimmed.replace(",", "."));
    if (isNaN(num) || num <= 0) { setLeadTime(personId, dateStr, null); return; }
    setLeadTime(personId, dateStr, num);
  }

  function handleNoteClick(personId, dateStr) {
    if (!personId) return;
    const cur = (data.availability[personId] || {})[dateStr];
    const curVal = cur && cur.note ? cur.note : "";
    const input = window.prompt(`Wichtiger Hinweis für ${dateStr}.\nLeer lassen zum Entfernen.`, curVal);
    if (input === null) return;
    setNote(personId, dateStr, input.trim());
  }

  function setDayRole(dateStr, personId, role) {
    const wholeWeek = dowMon0(dateStr) === 0;
    const datesToApply = wholeWeek ? weekFromMonday(dateStr) : [dateStr];
    commit((prev) => {
      const assignments = { ...prev.assignments };
      const backupAssignments = { ...prev.backupAssignments };
      let primary = assignments[dateStr] || null;
      let backup = backupAssignments[dateStr] || null;
      if (role === "primary") {
        if (primary === personId) {
          primary = null;
        } else {
          if (backup === personId) backup = null;
          primary = personId;
        }
      } else {
        if (backup === personId) {
          backup = null;
        } else if (primary === personId) {
          return prev; // eine Person kann nicht gleichzeitig Primär und Backup sein
        } else {
          backup = personId;
        }
      }
      datesToApply.forEach((ds) => {
        if (primary) assignments[ds] = primary; else delete assignments[ds];
        if (backup) backupAssignments[ds] = backup; else delete backupAssignments[ds];
      });
      return { ...prev, assignments, backupAssignments };
    });
  }

  function goPrevMonth() {
    setViewMonth((m) => { if (m === 0) { setViewYear((y) => y - 1); return 11; } return m - 1; });
  }
  function goNextMonth() {
    setViewMonth((m) => { if (m === 11) { setViewYear((y) => y + 1); return 0; } return m + 1; });
  }

  function addBatch(materialId, qty, expiry, lot) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) =>
        m.id === materialId
          ? { ...m, batches: [...m.batches, { id: newId(), qty, expiry: expiry || null, lot: lot || "" }] }
          : m
      ),
    }));
  }

  function consumeMaterialQty(materialId, qty) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) => {
        if (m.id !== materialId) return m;
        let remaining = qty;
        const sorted = [...m.batches].sort((a, b) => {
          if (!a.expiry && !b.expiry) return 0;
          if (!a.expiry) return 1;
          if (!b.expiry) return -1;
          return a.expiry.localeCompare(b.expiry);
        });
        const newBatches = [];
        for (const b of sorted) {
          if (remaining <= 0) { newBatches.push(b); continue; }
          if (b.qty <= remaining) { remaining -= b.qty; }
          else { newBatches.push({ ...b, qty: b.qty - remaining }); remaining = 0; }
        }
        return { ...m, batches: newBatches };
      }),
    }));
  }

  function deleteBatch(materialId, batchId) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) =>
        m.id === materialId ? { ...m, batches: m.batches.filter((b) => b.id !== batchId) } : m
      ),
    }));
  }

  function updateMinQty(materialId, minQty) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) => (m.id === materialId ? { ...m, minQty } : m)),
    }));
  }

  function addCustomMaterial(name, refNr, minQty) {
    commit((prev) => ({
      ...prev,
      materials: [...prev.materials, { id: newId(), name, refNr, minQty, batches: [] }],
    }));
  }

  function deleteMaterial(materialId) {
    commit((prev) => ({ ...prev, materials: prev.materials.filter((m) => m.id !== materialId) }));
  }

  function updateMaterialName(materialId, name) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) => (m.id === materialId ? { ...m, name } : m)),
    }));
  }

  function updateMaterialUsage(materialId, usage) {
    commit((prev) => ({
      ...prev,
      materials: prev.materials.map((m) => (m.id === materialId ? { ...m, usage } : m)),
    }));
  }

  async function uploadMaterialImage(materialId, file) {
    if (!file) return;
    try {

      await apiSetDoc("materials/" + materialId, { imageDataUrl: dataUrl });

    } catch (e) {
      console.error("Bild-Upload fehlgeschlagen", e);
      window.alert("Bild konnte nicht gespeichert werden: " + (e && e.message ? e.message : "unbekannter Fehler"));
    }
  }

  function removeMaterialImage(materialId) {
    apiDeleteDoc("materials/" + materialId).catch((e) => console.error(e));
    setMaterialImages((prev) => {
      const next = { ...prev };
      delete next[materialId];
      return next;
    });

  function updateChecklistItem(listKey, itemId, patch) {
    commit((prev) => {
      const checklists = { ...prev.checklists };
      checklists[listKey] = checklists[listKey].map((it) => (it.id === itemId ? { ...it, ...patch } : it));
      return { ...prev, checklists };
    });
  }
  function addChecklistItem(listKey, label) {
    commit((prev) => {
      const checklists = { ...prev.checklists };
      checklists[listKey] = [...checklists[listKey], checklistItem(newId(), label, null, 1)];
      return { ...prev, checklists };
    });
  }
  function removeChecklistItem(listKey, itemId) {
    commit((prev) => {
      const checklists = { ...prev.checklists };
      checklists[listKey] = checklists[listKey].filter((it) => it.id !== itemId);
      return { ...prev, checklists };
    });
  }

  function setEinsatzOrgan(organ) {
    commitEinsatz((prev) => ({ ...prev, organ }));
  }
  function setItemQty(itemId, qty) {
    commitEinsatz((prev) => {
      const itemStatus = { ...prev.itemStatus };
      itemStatus[itemId] = { ...(itemStatus[itemId] || {}), qty };
      return { ...prev, itemStatus };
    });
  }
  function markItemsPacked(itemIds) {
    commitEinsatz((prev) => {
      const itemStatus = { ...prev.itemStatus };
      itemIds.forEach((id) => { itemStatus[id] = { ...(itemStatus[id] || {}), status: "packed" }; });
      return { ...prev, itemStatus };
    });
  }
  function markItemsConsumed(items) {
    items.forEach((it) => { if (it.materialId) consumeMaterialQty(it.materialId, it.qty); });
    commitEinsatz((prev) => {
      const itemStatus = { ...prev.itemStatus };
      items.forEach((it) => { itemStatus[it.id] = { ...(itemStatus[it.id] || {}), status: "consumed" }; });
      return { ...prev, itemStatus };
    });

  function resetEinsatzChecklist() {
    if (!window.confirm("Einsatz wirklich zurücksetzen? Der Materialbestand bleibt unverändert.")) return;
    commitEinsatz(defaultEinsatz());

  function triggerBrowserDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  async function exportMaterialPdf() {
    try {
      if (!window.jspdf && !window.jsPDF) {
        window.alert("Die PDF-Bibliothek konnte nicht geladen werden (evtl. Internetverbindung oder Werbeblocker prüfen). Bitte Seite neu laden und erneut versuchen.");
        return;
      }
      const blob = buildMaterialReportPdf(data.materials || []);
      triggerBrowserDownload(blob, "material-bericht.pdf");
    } catch (e) {
      console.error("PDF-Export fehlgeschlagen", e);
      window.alert("PDF-Export ist fehlgeschlagen: " + (e && e.message ? e.message : "unbekannter Fehler"));
    }
  }

  async function exportPersonIcs(personId) {
    try {
      const ics = buildPersonIcs(data, personId);
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      triggerBrowserDownload(blob, "rufdienst-" + personId + ".ics");
    } catch (e) {
      console.error("ICS-Export fehlgeschlagen", e);
      window.alert("Kalender-Export ist fehlgeschlagen.");
    }
  }

  function resetMonthData(year, month) {
    if (!window.confirm(`Wirklich alle Verfügbarkeiten und Zuweisungen für ${MONTH_NAMES[month]} ${year} löschen? Material und Telefonnummern bleiben unberührt.`)) return;
    commit((prev) => {
      const availability = {};
      Object.entries(prev.availability).forEach(([personId, days]) => {
        const filtered = {};
        Object.entries(days).forEach(([ds, entry]) => {
          const p = parseDstr(ds);
          if (!(p.y === year && p.m === month)) filtered[ds] = entry;
        });
        availability[personId] = filtered;
      });
      const assignments = {};
      Object.entries(prev.assignments).forEach(([ds, pid]) => {
        const p = parseDstr(ds);
        if (!(p.y === year && p.m === month)) assignments[ds] = pid;
      });
      const backupAssignments = {};
      Object.entries(prev.backupAssignments || {}).forEach(([ds, pid]) => {
        const p = parseDstr(ds);
        if (!(p.y === year && p.m === month)) backupAssignments[ds] = pid;
      });
      return { ...prev, availability, assignments, backupAssignments };
    });
  }

  /* ---------- abgeleitete Werte ---------- */

  const weeks = useMemo(() => buildMonthGrid(viewYear, viewMonth), [viewYear, viewMonth]);
  const holidaySet = useMemo(() => shHolidays(statYear), [statYear]);

  const stats = useMemo(() => {
    if (!data) return {};
    const counts = {};
    data.members.forEach((m) => (counts[m.id] = { total: 0, holiday: 0, backup: 0 }));
    Object.entries(data.assignments).forEach(([ds, pid]) => {
      if (ds.slice(0, 4) !== String(statYear)) return;
      if (!counts[pid]) counts[pid] = { total: 0, holiday: 0, backup: 0 };
      counts[pid].total++;
      if (holidaySet.has(ds)) counts[pid].holiday++;
    });
    Object.entries(data.backupAssignments || {}).forEach(([ds, pid]) => {
      if (ds.slice(0, 4) !== String(statYear)) return;
      if (!counts[pid]) counts[pid] = { total: 0, holiday: 0, backup: 0 };
      counts[pid].backup++;
    });
    return counts;
  }, [data, statYear, holidaySet]);

  const availableYears = useMemo(() => {
    const set = new Set([now.getFullYear()]);
    if (data) Object.keys(data.assignments).forEach((ds) => set.add(Number(ds.slice(0, 4))));
    return Array.from(set).sort();
  }, [data]);

  /* ---------- Render: Login ---------- */

  if (!unlocked) {
    const ds = todayStr();
    const previewPrimaryId = data ? data.assignments[ds] : null;
    const previewBackupId = data ? (data.backupAssignments || {})[ds] : null;
    const previewPrimary = previewPrimaryId && data ? data.members.find((m) => m.id === previewPrimaryId) : null;
    const previewBackup = previewBackupId && data ? data.members.find((m) => m.id === previewBackupId) : null;
    const previewLeadTime = previewPrimaryId && data ? ((data.availability[previewPrimaryId] || {})[ds] || {}).leadTimeHours : null;
    const previewNote = previewPrimaryId && data ? ((data.availability[previewPrimaryId] || {})[ds] || {}).note : null;

    return (
      <div className="tx-app">
          <div className="login-screen">
          <div className="login-card">
            <Logo size={64} />
            <h1 className="login-title">Team Thoraxorgane</h1>
            <p className="login-sub">Rufdienstplan</p>

            {data && (
              <div className="login-oncall-preview">
                <div className="login-oncall-label">Heute im Rufdienst</div>
                {previewPrimary ? (
                  <div className="login-oncall-name" style={{ color: colorFor(data.members, previewPrimary.id) }}>{previewPrimary.name}</div>
                ) : (
                  <div className="login-oncall-name login-oncall-none">Niemand zugewiesen</div>
                )}
                {previewLeadTime ? (
                  <div className="login-oncall-lead">⏱ Braucht {previewLeadTime} Std. Vorlaufzeit</div>
                ) : null}
                {previewNote ? (
                  <div className="login-oncall-lead">❗ {previewNote}</div>
                ) : null}
                {previewBackup && (
                  <div className="login-oncall-backup">Backup: {previewBackup.name}</div>
                )}
              </div>
            )}

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (pwInput === PASSWORD) { currentAppPassword = pwInput; setUnlocked(true); setPwError(false); }
                else setPwError(true);
              }}
            >
              <input
                type="password"
                className="login-input"
                placeholder="Passwort"
                value={pwInput}
                onChange={(e) => { setPwInput(e.target.value); setPwError(false); }}
                autoFocus
              />
              {pwError && <p className="login-error">Falsches Passwort.</p>}
              <button type="submit" className="btn btn-primary login-btn">Anmelden</button>
            </form>
          </div>
        </div>
      </div>
    );
  }

  if (loading || !data) {
    return (
      <div className="tx-app">
          <div className="login-screen"><p className="loading-text">Lädt …</p></div>
      </div>
    );
  }

  /* ---------- Render: App ---------- */

  return (
    <div className="tx-app">
      <header className="app-header">
        <div className="header-brand">
          <Logo size={36} />
          <div>
            <div className="brand-title">Team Thoraxorgane</div>
            <div className="brand-sub">Rufdienstplan</div>
          </div>
        </div>
        <nav className="tab-nav">
          <button className={`tab-btn ${tab === "uebersicht" ? "active" : ""}`} onClick={() => setTab("uebersicht")}>Übersicht</button>
          <button className={`tab-btn ${tab === "einsatz" ? "active" : ""}`} onClick={() => setTab("einsatz")}>Im Einsatz</button>
          <button className={`tab-btn ${tab === "material" ? "active" : ""}`} onClick={() => setTab("material")}>Material</button>
          <button className={`tab-btn ${tab === "verfuegbar" ? "active" : ""}`} onClick={() => setTab("verfuegbar")}>Verfügbarkeit</button>
          <button className={`tab-btn ${tab === "admin" ? "active" : ""}`} onClick={() => setTab("admin")}>Admin</button>
          <button className={`tab-btn ${tab === "statistik" ? "active" : ""}`} onClick={() => setTab("statistik")}>Statistik</button>
        </nav>
        <button
          className="btn btn-ghost lock-btn"
          title="Zurück zur gesperrten Startseite"
          onClick={() => {
            currentAppPassword = "";
            setPwInput("");
            setUnlocked(false);
          }}
        >
          🔒 Abmelden
        </button>
      </header>

      <main className="app-main">
        {tab === "verfuegbar" && (
          <VerfuegbarTab
            data={data}
            currentPerson={currentPerson}
            setCurrentPerson={setCurrentPerson}
            updatePhone={updatePhone}
            viewYear={viewYear}
            viewMonth={viewMonth}
            weeks={weeks}
            goPrevMonth={goPrevMonth}
            goNextMonth={goNextMonth}
            handleAvailClick={handleAvailClick}
            handleAvailDoubleClick={handleAvailDoubleClick}
            handleLeadTimeClick={handleLeadTimeClick}
            handleNoteClick={handleNoteClick}
            exportPersonIcs={exportPersonIcs}
          />
        )}
        {tab === "admin" && (
          <AdminTab
            data={data}
            viewYear={viewYear}
            viewMonth={viewMonth}
            weeks={weeks}
            goPrevMonth={goPrevMonth}
            goNextMonth={goNextMonth}

          />

        {tab === "uebersicht" && (
          <UebersichtTab

            viewMonth={viewMonth}
            weeks={weeks}
            goPrevMonth={goPrevMonth}
            goNextMonth={goNextMonth}

        {tab === "statistik" && (
          <StatistikTab

            setStatYear={setStatYear}

          />
        )}
        {tab === "material" && (
          <MaterialTab
            data={data}

            addBatch={addBatch}
            consumeQty={consumeMaterialQty}
            deleteBatch={deleteBatch}
            updateMinQty={updateMinQty}
            addCustomMaterial={addCustomMaterial}
            deleteMaterial={deleteMaterial}
            updateMaterialName={updateMaterialName}
            updateMaterialUsage={updateMaterialUsage}
            uploadMaterialImage={uploadMaterialImage}
            removeMaterialImage={removeMaterialImage}

          />

        {tab === "einsatz" && (

}

/* ---------- Tab: Admin ---------- */

function AdminTab({ data, viewYear, viewMonth, weeks, goPrevMonth, goNextMonth, setDayRole, resetMonthData, updateMemberName, updateMemberColor }) {
  const today = todayStr();
  const [showPeople, setShowPeople] = useState(false);
  const [nameDrafts, setNameDrafts] = useState({});

  function nameValue(m) {
    return nameDrafts[m.id] !== undefined ? nameDrafts[m.id] : m.name;
  }
  function commitName(m) {
    const val = (nameDrafts[m.id] !== undefined ? nameDrafts[m.id] : m.name).trim();
    if (val && val !== m.name) updateMemberName(m.id, val);
    setNameDrafts((d) => { const n = { ...d }; delete n[m.id]; return n; });
  }

  return (
    <div className="tab-content">
      <p className="hint-text">
        Klick auf einen Namen an einem <strong>Montag</strong> weist ihn für die <strong>ganze Woche</strong> als Rufdienst zu. Klick auf einen Namen an einem <strong>anderen Tag</strong> gilt nur für diesen einen Tag (z. B. um das Wochenende an jemand anderen zu vergeben). <strong>Linksklick</strong> = Primär, <strong>Rechtsklick</strong> = Backup. Nochmaliger Klick entfernt die Zuweisung wieder. Es werden nur Personen angezeigt, die für den jeweiligen Tag Verfügbarkeit gemeldet haben.
      </p>

      <div className="legend-row">
        <span className="legend-chip"><span className="legend-dot legend-dot-verf"></span>Verfügbar</span>
        <span className="legend-chip"><span className="legend-dot legend-dot-viell"></span>Vielleicht</span>
        <span className="legend-chip"><span className="assign-role-tag assign-role-primary">P</span> Primär</span>
        <span className="legend-chip"><span className="assign-role-tag assign-role-backup">B</span> Backup</span>
        <span className="legend-chip">⏱ Vorlaufzeit gemeldet</span>
      </div>

      <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />

      <CalendarShell
        weeks={weeks}
        viewMonth={viewMonth}
        renderCell={(dateStr, inMonth) => {
          const isMon = dowMon0(dateStr) === 0;
          const primaryId = data.assignments[dateStr];
          const backupId = (data.backupAssignments || {})[dateStr];
          const available = availablePeopleForDay(data, dateStr);
          const isToday = dateStr === today;
          return (
            <div className={`cell cell-admin ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""} ${isMon ? "cell-admin-monday" : ""}`}>
              <div className="cell-top">
                <span className="cell-daynum">{parseDstr(dateStr).d}</span>
                {isMon && <span className="admin-week-hint" title="Klick hier wirkt auf die ganze Woche">Wo</span>}
              </div>
              <div className="admin-chip-list">
                {available.length === 0 && <span className="admin-no-avail">–</span>}
                {available.map(({ member, status, hasLeadTime, note }) => {
                  const isPrimary = primaryId === member.id;
                  const isBackup = backupId === member.id;
                  return (
                    <button
                      key={member.id}
                      type="button"
                      className={`admin-mini-chip ${status ? "admin-mini-chip-" + status : ""} ${isPrimary ? "admin-mini-chip-primary" : ""} ${isBackup ? "admin-mini-chip-backup" : ""}`}
                      style={isPrimary || isBackup ? { borderColor: colorFor(data.members, member.id) } : {}}
                      onClick={(e) => { e.stopPropagation(); setDayRole(dateStr, member.id, "primary"); }}
                      onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); setDayRole(dateStr, member.id, "backup"); }}
                      title={`${member.name}${isMon ? " – wirkt auf die ganze Woche" : ""}${note ? " – Hinweis: " + note : ""}`}
                    >
                      {shortMemberName(data.members, member)}
                      {isPrimary && <span className="admin-role-dot admin-role-dot-p">P</span>}
                      {isBackup && <span className="admin-role-dot admin-role-dot-b">B</span>}
                      {hasLeadTime && <span className="admin-lead-dot">⏱</span>}
                      {note && <span className="admin-note-dot">❗</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }}
      />

      <button className="btn btn-ghost reset-btn" onClick={() => resetMonthData(viewYear, viewMonth)}>
        <RotateCcw size={14} /> Daten in {MONTH_NAMES[viewMonth]} {viewYear} zurücksetzen
      </button>

      <div className="people-manage-panel">
        <button className="btn btn-ghost" onClick={() => setShowPeople((s) => !s)}>
          {showPeople ? "Personen ausblenden" : "Namen & Farben verwalten"}
        </button>
        {showPeople && (
          <div className="people-manage-list">
            {data.members.map((m) => (
              <div className="people-manage-row" key={m.id}>
                <input
                  type="color"
                  className="people-color-input"
                  value={m.color || "#8B8578"}
                  onChange={(e) => updateMemberColor(m.id, e.target.value)}
                  title="Farbe ändern"
                />
                <input
                  className="text-input people-name-input"
                  value={nameValue(m)}
                  onChange={(e) => setNameDrafts((d) => ({ ...d, [m.id]: e.target.value }))}
                  onBlur={() => commitName(m)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.currentTarget.blur(); } }}
                />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
