        <span className="legend-chip"><span className="admin-manual-tag">M</span> manuell eingeplant</span>
        <span className="legend-chip">⏱ Vorlaufzeit gemeldet</span>
      </div>

      <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />

      <CalendarShell
        weeks={weeks}
        viewMonth={viewMonth}
        renderCell={(dateStr, inMonth) => {
          const isMon = dowMon0(dateStr) === 0;
          const primaryId = data.assignments[dateStr];
          const backupId = (data.backupAssignments || {})[dateStr];
          const available = availablePeopleForDay(data, dateStr);
          const isToday = dateStr === today;
          return (
            <div className={`cell cell-admin ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""} ${isMon ? "cell-admin-monday" : ""}`}>
              <div className="cell-top">
                <span className="cell-daynum">{parseDstr(dateStr).d}</span>
                <button
                  type="button"
                  className="admin-add-btn"
                  title="Person manuell einplanen (ohne gemeldete Verfügbarkeit)"
                  onClick={() => openManual(dateStr)}
                >
                  +
                </button>
              </div>
              <div className="admin-chip-list">
                {available.length === 0 && <span className="admin-no-avail">–</span>}
                {available.map(({ member, status, hasLeadTime, note, manual, archived }) => {
                  const isPrimary = primaryId === member.id;
                  const isBackup = backupId === member.id;
                  return (
                    <button
                      key={member.id}
                      type="button"
                      disabled={archived}
                      className={`admin-mini-chip ${status ? "admin-mini-chip-" + status : ""} ${manual ? "admin-mini-chip-manual" : ""} ${archived ? "admin-mini-chip-archived" : ""} ${isPrimary ? "admin-mini-chip-primary" : ""} ${isBackup ? "admin-mini-chip-backup" : ""}`}
                      style={isPrimary || isBackup ? { borderColor: colorFor(data.members, member.id) } : {}}
                      onClick={(e) => { e.stopPropagation(); handleChipClick(dateStr, member.id, "primary"); }}
                      onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); handleChipClick(dateStr, member.id, "backup"); }}
                      title={`${member.name}${manual ? " – manuell eingeplant (keine Verfügbarkeit gemeldet)" : ""}${archived ? " – archiviert" : ""}${note ? " – Hinweis: " + note : ""}`}
                    >
                      {shortMemberName(data.members, member)}
                      {isPrimary && <span className="admin-role-dot admin-role-dot-p">P</span>}
                      {isBackup && <span className="admin-role-dot admin-role-dot-b">B</span>}
                      {manual && <span className="admin-manual-tag">M</span>}
                      {hasLeadTime && <span className="admin-lead-dot">⏱</span>}
                      {note && <span className="admin-note-dot">❗</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }}
      />

      <button className="btn btn-ghost reset-btn" onClick={() => resetMonthData(viewYear, viewMonth)}>
        <RotateCcw size={14} /> Daten in {MONTH_NAMES[viewMonth]} {viewYear} zurücksetzen
      </button>

      <div className="people-manage-panel">
        <button className="btn btn-ghost" onClick={() => setShowPeople((s) => !s)}>
          {showPeople ? "Personen ausblenden" : "Personen verwalten (Namen, Farben, Entfernen)"}
        </button>
        {showPeople && (
          <div className="people-manage-list">
            {activeMembers.map((m) => (
              <div className="people-manage-row" key={m.id}>
                <input
                  type="color"
                  className="people-color-input"
                  value={m.color || "#8B8578"}
                  onChange={(e) => updateMemberColor(m.id, e.target.value)}
                  title="Farbe ändern"
                />
                <input
                  className="text-input people-name-input"
                  value={nameValue(m)}
                  onChange={(e) => setNameDrafts((d) => ({ ...d, [m.id]: e.target.value }))}
                  onBlur={() => commitName(m)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.currentTarget.blur(); } }}
                />
                <button type="button" className="mini-btn mat-delete" title="Aus dem Team entfernen" onClick={() => askArchive(m)}>Entfernen</button>
              </div>
            ))}

            {archivedMembers.length > 0 && (
              <div className="people-archived">
                <div className="people-archived-title">Archiviert</div>
                {archivedMembers.map((m) => (
                  <div className="people-archived-row" key={m.id}>
                    <div className="people-archived-text">
                      <span className="people-archived-name">{m.name}</span>
                      <span className="people-archived-info">
                        {m.archivedAt ? `seit ${formatDateDe(m.archivedAt)} · wird zum Jahreswechsel (01.01.${Number(m.archivedAt.slice(0, 4)) + 1}) endgültig gelöscht` : "archiviert"}
                      </span>
                    </div>
                    <button type="button" className="mini-btn" onClick={() => restoreMember(m.id)}>Wiederherstellen</button>
                    <button type="button" className="mini-btn mat-delete" onClick={() => askDeletePermanent(m)}>Endgültig löschen</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {weekDialog && (
        <div className="modal-backdrop" onClick={() => setWeekDialog(null)}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">{wdIsRemoval ? "Für die ganze Woche entfernen?" : "Für die ganze Woche planen?"}</h3>
            <p className="modal-text">
              {memberName(data, weekDialog.personId)} – {weekDialog.role === "primary" ? "Primär" : "Backup"} · Montag, {formatDateDe(weekDialog.dateStr)}
            </p>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => confirmWeek("day")}>Nur Montag</button>
              <button className="btn btn-primary" onClick={() => confirmWeek("week")}>Ganze Woche</button>
              <button className="btn btn-ghost" onClick={() => setWeekDialog(null)}>Abbrechen</button>
            </div>
          </div>
        </div>
      )}

      {manualDialog && (
        <div className="modal-backdrop" onClick={closeManual}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">Person manuell einplanen</h3>
            <p className="modal-text">
              {WEEKDAY_FULL[dowMon0(manualDialog)]}, {formatDateDe(manualDialog)} – Personen ohne gemeldete Verfügbarkeit
            </p>
            {dowMon0(manualDialog) === 0 && (
              <label className="modal-check">
                <input type="checkbox" checked={manualWholeWeek} onChange={(e) => setManualWholeWeek(e.target.checked)} />
                Für die ganze Woche
              </label>
            )}
            {manualCandidates.length === 0 ? (
              <p className="hint-text">Alle aktiven Personen sind für diesen Tag bereits verfügbar oder eingeplant.</p>
            ) : (
              <div className="modal-list">
                {manualCandidates.map((m) => (
                  <div className="modal-row" key={m.id}>
                    <span className="modal-row-name" style={{ color: colorFor(data.members, m.id) }}>{m.name}</span>
                    <button className="btn btn-ghost" onClick={() => manualAdd(m.id, "primary")}>Primär</button>
                    <button className="btn btn-ghost" onClick={() => manualAdd(m.id, "backup")}>Backup</button>
                  </div>
                ))}
              </div>
            )}
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={closeManual}>Schließen</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Tab: Übersicht ---------- */

function UebersichtTab({ data, viewYear, viewMonth, weeks, goPrevMonth, goNextMonth }) {
  const today = todayStr();
  const todaysAssignedId = data.assignments[today];
  const todaysBackupId = (data.backupAssignments || {})[today];
  const todaysMember = todaysAssignedId ? data.members.find((m) => m.id === todaysAssignedId) : null;
  const todaysBackupMember = todaysBackupId ? data.members.find((m) => m.id === todaysBackupId) : null;
  const todaysAvail = todaysAssignedId ? (data.availability[todaysAssignedId] || {})[today] : null;
  const todaysLeadTime = todaysAvail ? todaysAvail.leadTimeHours : null;
  const todaysNote = todaysAvail ? todaysAvail.note : null;
  const telHref = todaysMember && todaysMember.phone ? `tel:${todaysMember.phone.replace(/[^0-9+]/g, "")}` : null;
  const backupTelHref = todaysBackupMember && todaysBackupMember.phone ? `tel:${todaysBackupMember.phone.replace(/[^0-9+]/g, "")}` : null;
  const weekdayLabel = WEEKDAY_FULL[dowMon0(today)];
  const { d } = parseDstr(today);

  return (
    <div className="tab-content">
      <div className="today-banner" style={{ borderColor: todaysAssignedId ? colorFor(data.members, todaysAssignedId) : "var(--line)" }}>
        <div className="today-date">{weekdayLabel}, {d}. {MONTH_NAMES[parseDstr(today).m]}</div>
        <div className="today-label">Heute im Rufdienst</div>
        {todaysMember ? (
          <>
            <div className="today-name" style={{ color: colorFor(data.members, todaysAssignedId) }}>{todaysMember.name}</div>
            {todaysLeadTime ? (
              <div className="today-leadwarn">⏱ Braucht {todaysLeadTime} Std. Vorlaufzeit</div>
            ) : null}
            {todaysNote ? (
              <div className="today-notewarn">❗ {todaysNote}</div>
            ) : null}
            {telHref ? (
              <a className="btn btn-call" href={telHref}><Phone size={16} /> Anrufen</a>
            ) : (
              <div className="no-phone-note">Keine Telefonnummer hinterlegt</div>
            )}
          </>
        ) : (
          <div className="today-name today-none">Niemand zugewiesen</div>
        )}
        {todaysBackupMember && (
          <div className="today-backup-block">
            <div className="today-backup-label">Backup</div>
            <div className="today-backup-name" style={{ color: colorFor(data.members, todaysBackupId) }}>{todaysBackupMember.name}</div>
            {backupTelHref ? (
              <a className="btn btn-ghost btn-call-backup" href={backupTelHref}><Phone size={14} /> Backup anrufen</a>
            ) : (
              <div className="no-phone-note">Keine Telefonnummer hinterlegt</div>
            )}
          </div>
        )}
      </div>

      <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />
      <CalendarShell
        weeks={weeks}
        viewMonth={viewMonth}
        renderCell={(dateStr, inMonth) => {
          const assignedId = data.assignments[dateStr];
          const backupId = (data.backupAssignments || {})[dateStr];
          const assignedMember = assignedId ? data.members.find((m) => m.id === assignedId) : null;
          const backupMember = backupId ? data.members.find((m) => m.id === backupId) : null;
          const availEntry = assignedId ? (data.availability[assignedId] || {})[dateStr] : null;
          const leadTime = availEntry ? availEntry.leadTimeHours : null;
          const note = availEntry ? availEntry.note : null;
          const isToday = dateStr === today;
          return (
            <div
              className={`cell cell-readonly ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""} ${leadTime ? "cell-leadwarn" : ""} ${note ? "cell-notewarn" : ""}`}
              style={{ borderLeftColor: assignedId ? colorFor(data.members, assignedId) : "transparent" }}
            >
              <span className="cell-daynum">{parseDstr(dateStr).d}</span>
              {isToday && <span className="today-tag">HEUTE</span>}
              {assignedMember && <span className="assigned-name" style={{ color: colorFor(data.members, assignedId) }}>{assignedMember.name}</span>}
              {backupMember && <span className="assigned-backup" style={{ color: colorFor(data.members, backupId) }}>Backup: {backupMember.name}</span>}
              {leadTime ? <span className="leadtime-tag">⏱ {leadTime} Std.</span> : null}
              {note ? <span className="note-tag" title={note}>❗ Hinweis</span> : null}
            </div>
          );
        }}
      />

      <div className="legend-row">
        {data.members.filter((m) => !m.archived).map((m) => (
          <span key={m.id} className="legend-chip">
            <span className="legend-dot" style={{ background: colorFor(data.members, m.id) }}></span>{m.name}
          </span>
        ))}
      </div>
    </div>
  );
}

/* ---------- Tab: Statistik ---------- */

function StatistikTab({ data, statYear, setStatYear, availableYears, stats, updateStatsBaseline }) {
  return (
    <div className="tab-content">
      <div className="panel">
        <label className="field-label">Jahr</label>
        <select className="select" value={statYear} onChange={(e) => setStatYear(Number(e.target.value))}>
          {availableYears.map((y) => (<option key={y} value={y}>{y}</option>))}
        </select>
      </div>

      <p className="hint-text">
        Jedes Kalenderjahr wird getrennt gezählt: Alle eingetragenen Tage zählen bis zum 31.12., am 01.01. beginnt eine neue Zählung bei 0 – frühere Jahre lassen sich oben auswählen. Der „Manuelle Ist-Stand" gilt nur für das ausgewählte Jahr: Er trägt die Anzahl bereits geleisteter Dienste bis zum „Stand vom"-Datum ein, danach zählen nur die in der App eingetragenen Dienste dazu (Tage davor werden nicht doppelt gezählt). Feiertage und Backup-Tage zählen nur in der App eingetragene Tage.
      </p>

      <div className="stats-table-wrap">
        <table className="stats-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Diensttage {statYear}</th>
              <th>davon an Feiertagen</th>
              <th>Backup-Tage</th>
              <th>Manueller Ist-Stand {statYear}</th>
              <th>Stand vom</th>
            </tr>
          </thead>
          <tbody>
            {data.members.map((m) => {
              const st = stats[m.id] || { count: 0, holiday: 0, backup: 0 };
              const baseline = baselineFor(data, m.id, statYear);
              return (
                <tr key={m.id}>
                  <td style={{ color: colorFor(data.members, m.id) }}>
                    {m.name}{m.archived ? <span className="stats-archived-tag"> (archiviert)</span> : null}
                  </td>
                  <td className="stats-total-cell">{st.count}</td>
                  <td>{st.holiday > 0 ? `${st.holiday}` : "–"}</td>
                  <td>{st.backup > 0 ? `${st.backup}` : "–"}</td>
                  <td>
                    <NumberStepper
                      min={0}
                      value={String(baseline.count || "")}
                      onChange={(val) => updateStatsBaseline(m.id, statYear, { count: Number(val) || 0 })}
                    />
                  </td>
                  <td>
                    <input
                      type="date" className="text-input stats-date-input"
                      min={`${statYear}-01-01`} max={`${statYear}-12-31`}
                      value={baseline.asOf || ""}
                      onChange={(e) => updateStatsBaseline(m.id, statYear, { asOf: e.target.value })}
                    />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Tab: Material ---------- */

function MaterialTab({ data, materialImages, addBatch, consumeQty, deleteBatch, updateMinQty, addCustomMaterial, deleteMaterial, updateMaterialName, updateMaterialUsage, uploadMaterialImage, removeMaterialImage, exportMaterialPdf, addMaterialCheck, deleteMaterialCheck }) {
  const [expanded, setExpanded] = useState({});
  const [batchForm, setBatchForm] = useState(null);
  const [batchQty, setBatchQty] = useState("");
  const [batchExpiry, setBatchExpiry] = useState("");
  const [batchLot, setBatchLot] = useState("");
  const [consumeForm, setConsumeForm] = useState(null);
  const [consumeQtyInput, setConsumeQtyInput] = useState("");
  const [onlyWarnings, setOnlyWarnings] = useState(false);
  const [showAddMaterial, setShowAddMaterial] = useState(false);
  const [newName, setNewName] = useState("");
  const [newRef, setNewRef] = useState("");
  const [newMin, setNewMin] = useState("");
  const [nameEdit, setNameEdit] = useState(null);
  const [nameEditValue, setNameEditValue] = useState("");
  const [exporting, setExporting] = useState(false);
  const [showCheckForm, setShowCheckForm] = useState(false);
  const [showCheckHistory, setShowCheckHistory] = useState(false);
  const [checkDate, setCheckDate] = useState(todayStr());
  const [checkPerson, setCheckPerson] = useState("");
  const [checkNote, setCheckNote] = useState("");

  const sortedChecks = useMemo(
    () => [...(data.materialChecks || [])].sort((a, b) => b.date.localeCompare(a.date)),
    [data.materialChecks]
  );
  const lastCheck = sortedChecks[0] || null;

  function submitCheck() {
    if (!checkDate) return;
    addMaterialCheck(checkDate, checkPerson || null, checkNote.trim());
    setCheckDate(todayStr());
    setCheckPerson("");
    setCheckNote("");
    setShowCheckForm(false);
    setShowCheckHistory(true);
  }

  const rows = useMemo(() => data.materials.map((m) => ({ mat: m, status: materialStatus(m) })), [data.materials]);

  const understockCount = rows.filter((r) => r.status.understock).length;
  const expiredCount = rows.filter((r) => r.status.expiryState === "expired").length;
  const soonCount = rows.filter((r) => r.status.expiryState === "soon").length;
  const hasWarnings = understockCount > 0 || expiredCount > 0 || soonCount > 0;

  const visibleRows = onlyWarnings
    ? rows.filter((r) => r.status.understock || r.status.expiryState !== "ok")
    : rows;

  function toggleExpand(id) { setExpanded((e) => ({ ...e, [id]: !e[id] })); }

  function openBatchForm(id) { setBatchForm(id); setBatchQty(""); setBatchExpiry(""); setBatchLot(""); setConsumeForm(null); }
  function submitBatchForm(id) {
    const qty = Number(batchQty);
    if (!qty || qty <= 0) return;
    addBatch(id, qty, batchExpiry || null, batchLot);
    setBatchForm(null);
  }

  function openConsumeForm(id) { setConsumeForm(id); setConsumeQtyInput(""); setBatchForm(null); }
  function submitConsumeForm(id) {
    const qty = Number(consumeQtyInput);
    if (!qty || qty <= 0) return;
    consumeQty(id, qty);
    setConsumeForm(null);
  }

  function submitNewMaterial() {
    if (!newName.trim()) return;
    addCustomMaterial(newName.trim(), newRef.trim(), Number(newMin) || 0);
    setNewName(""); setNewRef(""); setNewMin(""); setShowAddMaterial(false);
  }

  function startNameEdit(mat) { setNameEdit(mat.id); setNameEditValue(mat.name); }
  function submitNameEdit(id) {
    if (nameEditValue.trim()) updateMaterialName(id, nameEditValue.trim());
    setNameEdit(null);
  }

  async function handlePdfExport() {
    setExporting(true);
    try { await exportMaterialPdf(); } finally { setExporting(false); }
  }

  return (
    <div className="tab-content">
      <div className="mat-check-panel">
        <div className="mat-check-header">
          <div>
            <div className="mat-check-title">Letzte vollständige Materialkontrolle</div>
            {lastCheck ? (
              <div className="mat-check-last">
                {formatDateDe(lastCheck.date)}
                {lastCheck.personId ? ` – ${memberName(data, lastCheck.personId)}` : ""}
                {lastCheck.note ? <span className="mat-check-note"> · {lastCheck.note}</span> : null}
              </div>
            ) : (
              <div className="mat-check-last mat-check-none">Noch keine Kontrolle erfasst</div>
            )}
          </div>
          <div className="mat-check-actions">
            <button className="btn btn-ghost" onClick={() => setShowCheckForm((s) => !s)}>+ Kontrolle eintragen</button>
            {sortedChecks.length > 0 && (
              <button className="btn btn-ghost" onClick={() => setShowCheckHistory((s) => !s)}>
                {showCheckHistory ? "Verlauf ausblenden" : "Verlauf anzeigen"}
              </button>
            )}
          </div>
        </div>

        {showCheckForm && (
          <div className="inline-form">
            <input className="text-input" type="date" value={checkDate} onChange={(e) => setCheckDate(e.target.value)} />
            <select className="select" value={checkPerson} onChange={(e) => setCheckPerson(e.target.value)}>
              <option value="">– wer? (optional) –</option>
              {data.members.filter((m) => !m.archived).map((m) => (<option key={m.id} value={m.id}>{m.name}</option>))}
            </select>
            <input className="text-input" placeholder="Notiz (optional)" value={checkNote} onChange={(e) => setCheckNote(e.target.value)} />
            <button className="btn btn-primary" onClick={submitCheck}>Speichern</button>
            <button className="btn btn-ghost" onClick={() => setShowCheckForm(false)}>Abbrechen</button>
          </div>
        )}

        {showCheckHistory && sortedChecks.length > 0 && (
          <table className="mat-check-table">
            <thead><tr><th>Datum</th><th>Durchgeführt von</th><th>Notiz</th><th></th></tr></thead>
            <tbody>
              {sortedChecks.map((c) => (
                <tr key={c.id}>
                  <td>{formatDateDe(c.date)}</td>
                  <td>{c.personId ? memberName(data, c.personId) : "–"}</td>
                  <td>{c.note || "–"}</td>
                  <td><button className="mini-btn" onClick={() => deleteMaterialCheck(c.id)}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <div className={`mat-summary ${hasWarnings ? "mat-summary-warn" : "mat-summary-ok"}`}>
        {hasWarnings ? (
          <span>
            {understockCount > 0 && <>⚠ {understockCount} Artikel unter Mindestmenge &nbsp; </>}
            {expiredCount > 0 && <>⏰ {expiredCount} Charge(n) abgelaufen &nbsp; </>}
            {soonCount > 0 && <>🕓 {soonCount} Charge(n) laufen bald ab</>}
          </span>
        ) : (
          <span>✓ Alle Bestände im grünen Bereich</span>
        )}
      </div>

      <div className="mat-controls">
        <label className="mat-filter-label">
          <input type="checkbox" checked={onlyWarnings} onChange={(e) => setOnlyWarnings(e.target.checked)} />
          Nur Warnungen anzeigen
        </label>
        <div className="mat-controls-right">
          <button className="btn btn-ghost" onClick={handlePdfExport} disabled={exporting}>
            <Download size={14} /> {exporting ? "Wird erstellt …" : "Bericht als PDF"}
          </button>
          <button className="btn btn-ghost" onClick={() => setShowAddMaterial((s) => !s)}>+ Neues Material</button>
        </div>
      </div>

      {showAddMaterial && (
        <div className="inline-form">
          <input className="text-input" placeholder="Artikelname" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <input className="text-input" placeholder="Ref.-Nummer (optional)" value={newRef} onChange={(e) => setNewRef(e.target.value)} />
          <NumberStepper min={0} placeholder="Mindestmenge" value={newMin} onChange={setNewMin} />
          <button className="btn btn-primary" onClick={submitNewMaterial}>Hinzufügen</button>
          <button className="btn btn-ghost" onClick={() => setShowAddMaterial(false)}>Abbrechen</button>
        </div>
      )}

      <div className="mat-list">
        {visibleRows.length === 0 && <p className="hint-text">Keine Artikel zu sehen.</p>}
        {visibleRows.map(({ mat, status }) => {
          const isExpanded = !!expanded[mat.id];
          const qtyBadgeClass = status.understock ? "mat-badge-bad" : "mat-badge-ok";
          const expiryBadgeClass = status.expiryState === "expired" ? "mat-badge-bad" : status.expiryState === "soon" ? "mat-badge-warn" : "";
          const image = materialImages ? materialImages[mat.id] : null;
          return (
            <div key={mat.id} className="mat-row">
              <div className="mat-row-main" onClick={() => toggleExpand(mat.id)}>
                {image ? <img src={image} alt="" className="mat-thumb" /> : <div className="mat-thumb mat-thumb-empty"><ImageIcon size={14} /></div>}
                <div className="mat-name-block">
                  <div className="mat-name">{mat.name}</div>
                  {mat.refNr ? <div className="mat-ref">Ref.: {mat.refNr}</div> : null}
                </div>
                {mat.usage ? <div className="mat-usage-badge">{USAGE_LABELS[mat.usage]}</div> : null}
                <div className={`mat-qty-badge ${qtyBadgeClass}`}>
                  {status.total}{mat.minQty > 0 ? ` / ${mat.minQty}` : ""} Stk.
                </div>
                <div className={`mat-expiry-badge ${expiryBadgeClass}`}>
                  {status.soonest ? `MHD ${status.soonest}` : "kein MHD hinterlegt"}
                </div>
              </div>

              {isExpanded && (
                <div className="mat-detail">
                  <div className="mat-editrow">
                    <div className="mat-image-edit">
                      {image ? <img src={image} alt="" className="mat-thumb-lg" /> : <div className="mat-thumb-lg mat-thumb-empty"><ImageIcon size={22} /></div>}
                      <div className="mat-image-actions">
                        <label className="btn btn-ghost mat-upload-label">
                          <ImageIcon size={13} /> Bild wählen
                          <input
                            type="file" accept="image/*" className="mat-file-input"
                            onChange={(e) => { if (e.target.files && e.target.files[0]) uploadMaterialImage(mat.id, e.target.files[0]); e.target.value = ""; }}
                          />
                        </label>
                        {image && <button className="mini-btn" onClick={() => removeMaterialImage(mat.id)}><Trash2 size={12} /></button>}
                      </div>
                    </div>

                    <div className="mat-name-edit-block">
                      {nameEdit === mat.id ? (
                        <div className="inline-form">
                          <input className="text-input" value={nameEditValue} onChange={(e) => setNameEditValue(e.target.value)} autoFocus />
                          <button className="btn btn-primary" onClick={() => submitNameEdit(mat.id)}>Speichern</button>
                          <button className="btn btn-ghost" onClick={() => setNameEdit(null)}>Abbrechen</button>
                        </div>
                      ) : (
                        <button className="mat-name-edit-btn" onClick={() => startNameEdit(mat)}>
                          <Pencil size={12} /> Namen ändern
                        </button>
                      )}
                      <div className="mat-usage-picker">
                        <span className="field-label">Verwendung:</span>
                        {["lunge", "herz", "beide"].map((u) => (
                          <button
                            key={u}
                            className={`usage-btn ${mat.usage === u ? "usage-btn-active" : ""}`}
                            onClick={() => updateMaterialUsage(mat.id, mat.usage === u ? null : u)}
                          >
                            {USAGE_LABELS[u]}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {mat.batches.length === 0 ? (
                    <p className="hint-text">Keine Chargen erfasst.</p>
                  ) : (
                    <table className="mat-batch-table">
                      <thead><tr><th>Menge</th><th>Verfallsdatum</th><th>Charge/LOT</th><th></th></tr></thead>
                      <tbody>
                        {mat.batches.map((b) => {
                          const du = b.expiry ? daysUntil(b.expiry) : null;
                          const cls = du !== null && du < 0 ? "mat-batch-expired" : du !== null && du <= EXPIRY_WARNING_DAYS ? "mat-batch-soon" : "";
                          return (
                            <tr key={b.id} className={cls}>
                              <td>{b.qty}</td>
                              <td>{b.expiry || "–"}</td>
                              <td>{b.lot || "–"}</td>
                              <td><button className="mini-btn" onClick={() => deleteBatch(mat.id, b.id)}>✕</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}

                  <div className="mat-actions">
                    <button className="btn btn-ghost" onClick={() => openBatchForm(mat.id)}>+ Charge</button>
                    <button className="btn btn-ghost" onClick={() => openConsumeForm(mat.id)}>− Verbrauch</button>
                    <span className="mat-min-edit">
                      Mindestmenge:
                      <NumberStepper
                        min={0}
                        value={String(mat.minQty)}
                        onChange={(val) => updateMinQty(mat.id, Number(val) || 0)}
                      />
                    </span>
                    <button
                      className="mini-btn mat-delete"
                      onClick={() => { if (window.confirm(`„${mat.name}" wirklich aus der Materialliste entfernen?`)) deleteMaterial(mat.id); }}
                    >
                      Artikel löschen
                    </button>
                  </div>

                  {batchForm === mat.id && (
                    <div className="inline-form">
                      <NumberStepper min={1} placeholder="Menge" value={batchQty} onChange={setBatchQty} />
                      <input className="text-input" type="date" value={batchExpiry} onChange={(e) => setBatchExpiry(e.target.value)} />
                      <input className="text-input" placeholder="LOT (optional)" value={batchLot} onChange={(e) => setBatchLot(e.target.value)} />
                      <button className="btn btn-primary" onClick={() => submitBatchForm(mat.id)}>Speichern</button>
                      <button className="btn btn-ghost" onClick={() => setBatchForm(null)}>Abbrechen</button>
                    </div>
                  )}
                  {consumeForm === mat.id && (
                    <div className="inline-form">
                      <NumberStepper min={1} placeholder="Verbrauchte Menge" value={consumeQtyInput} onChange={setConsumeQtyInput} />
                      <button className="btn btn-primary" onClick={() => submitConsumeForm(mat.id)}>Abbuchen</button>
                      <button className="btn btn-ghost" onClick={() => setConsumeForm(null)}>Abbrechen</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Tab: Im Einsatz ---------- */

function EinsatzTab({ data, einsatz, setEinsatzOrgan, setItemQty, markItemsPacked, markItemsConsumed, resetEinsatzChecklist }) {
  const [checked, setChecked] = useState({});
  const organ = einsatz.organ;

  function toggleChecked(materialId) {
    setChecked((c) => ({ ...c, [materialId]: !c[materialId] }));
  }

  const itemsForOrgan = organ ? data.materials.filter((m) => m.usage === organ || m.usage === "beide") : [];

  function renderMaterialRow(material) {
    const entry = einsatz.itemStatus[material.id] || {};
    const status = entry.status || "offen";
    const qty = entry.qty || 1;
    const stock = materialTotalQty(material);
    const isChecked = !!checked[material.id];
    return (
      <div key={material.id} className={`einsatz-item einsatz-item-${status}`}>
        <label className="einsatz-item-main">
          <input type="checkbox" checked={isChecked} onChange={() => toggleChecked(material.id)} disabled={status === "consumed"} />
          <span className="einsatz-item-label">{material.name}</span>
          {status === "packed" && <span className="einsatz-status-tag einsatz-status-packed">gepackt</span>}
          {status === "consumed" && <span className="einsatz-status-tag einsatz-status-consumed">verbraucht</span>}
        </label>
        <div className="einsatz-item-meta">
          <span className={`einsatz-linked ${stock <= 0 ? "einsatz-linked-empty" : ""}`}>Bestand: {stock}</span>
          <span className="field-label">Menge:</span>
          <NumberStepper
            min={1}
            className="einsatz-qty-input"
            value={String(qty)}
            onChange={(val) => setItemQty(material.id, Math.max(1, Number(val) || 1))}
            disabled={status === "consumed"}
          />
        </div>
      </div>
    );
  }

  function selectedItemsData() {
    return itemsForOrgan
      .filter((m) => checked[m.id])
      .map((m) => {
        const entry = einsatz.itemStatus[m.id] || {};
        return { id: m.id, materialId: m.id, qty: entry.qty || 1 };
      });
  }

  const anyChecked = itemsForOrgan.some((m) => checked[m.id]);

  function handleMarkPacked() {
    const ids = itemsForOrgan.filter((m) => checked[m.id]).map((m) => m.id);
    markItemsPacked(ids);
    setChecked((c) => { const n = { ...c }; ids.forEach((id) => delete n[id]); return n; });
  }
  function handleMarkConsumed() {
    const items = selectedItemsData();
    markItemsConsumed(items);
    setChecked((c) => { const n = { ...c }; items.forEach((it) => delete n[it.id]); return n; });
  }

  const organLabel = organ === "lunge" ? "Lunge" : organ === "herz" ? "Herz" : "";

  return (
    <div className="tab-content">
      <div className="panel">
        <div>
          <label className="field-label">Einsatzart</label>
          <div className="organ-picker">
            <button className={`organ-btn ${organ === "lunge" ? "organ-btn-active" : ""}`} onClick={() => setEinsatzOrgan("lunge")}>Lunge</button>
            <button className={`organ-btn ${organ === "herz" ? "organ-btn-active" : ""}`} onClick={() => setEinsatzOrgan("herz")}>Herz</button>
          </div>
        </div>
      </div>

      {!organ ? (
        <p className="hint-text">Bitte oben Lunge oder Herz wählen, um die Materialliste zu sehen.</p>
      ) : itemsForOrgan.length === 0 ? (
        <p className="hint-text">
          Noch kein Material für „{organLabel}" hinterlegt. Im Material-Tab bei den einzelnen Artikeln die Verwendung „{organLabel}" oder „Beide" zuweisen.
        </p>
      ) : (
        <>
          <div className="einsatz-section">
            <h3 className="einsatz-section-title">Material für {organLabel}</h3>
            {itemsForOrgan.map((m) => renderMaterialRow(m))}
          </div>

          <div className="einsatz-actions">
            <button className="btn btn-ghost" onClick={handleMarkPacked} disabled={!anyChecked}>Ausgewählte als gepackt markieren</button>
            <button className="btn btn-primary" onClick={handleMarkConsumed} disabled={!anyChecked}>Ausgewählte als verbraucht markieren (Bestand abziehen)</button>
            <button className="btn btn-ghost" onClick={resetEinsatzChecklist}><RotateCcw size={14} /> Einsatz zurücksetzen</button>
          </div>
          <p className="hint-text">
            „Gepackt" merkt vor, was mitgenommen wurde – der Bestand ändert sich noch nicht. „Verbraucht" bucht die eingestellte Menge tatsächlich vom Material-Bestand ab. Welche Artikel hier erscheinen, legst du im Material-Tab über die Verwendung (Lunge/Herz/Beide) fest.
          </p>
        </>
      )}
    </div>
  );
}

/* ---------- Tab: TPZ (reine Dienstplanung, komplett getrennt vom Rufdienst) ----------
   Eigener Datenspeicher "tpz/state" (eigene Mitarbeitenden-Liste, eigene Verfügbarkeiten, eigener Plan).
   Es werden keine Daten aus "app/state" gelesen oder verändert. Dienste gelten für ganze Tage. */

const TPZ_DOC = "tpz/state";
const TPZ_COLORS = ["#3E7C8A", "#B23A32", "#C98A2E", "#5B7A4F", "#6B5A85", "#3F5D7D", "#A85C32", "#4F7CAC", "#A0527C", "#6B7F2A"];

function tpzDefaultData() {
  return { members: [], availability: {}, plan: {} };
}

function tpzNormalize(remote) {
  const d = remote && typeof remote === "object" ? remote : {};
  return {
    members: Array.isArray(d.members) ? d.members : [],
    availability: d.availability && typeof d.availability === "object" ? d.availability : {},
    plan: d.plan && typeof d.plan === "object" ? d.plan : {},
  };
}

function tpzEntryIsEmpty(e) { return !e || (!e.status && !e.note); }

function tpzReported(data, pid, ds) {
  const e = (data.availability[pid] || {})[ds];
  return e && (e.status === "verfuegbar" || e.status === "vielleicht") ? e : null;
}

function TpzTab() {
  const [data, setData] = useState(null);
  const [online, setOnline] = useState(null); // null = lädt, true = Speicher erreichbar, false = nicht erreichbar (Testmodus)
  const [saveError, setSaveError] = useState("");
  const [section, setSection] = useState("plan");
  const now = new Date();
  const [viewYear, setViewYear] = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth());
  const [statYear, setStatYear] = useState(now.getFullYear());
  const [currentPerson, setCurrentPerson] = useState("");

  const dirty = useRef(false);
  const onlineRef = useRef(null);
  const offlineEdits = useRef(false);
  const dataRef = useRef(null);
  const saveTimer = useRef(null);
  const clickTimers = useRef({});
  dataRef.current = data;

  function commit(updater) {
    // Ohne erreichbaren Speicher wird nichts zum Server geschickt (verhindert, dass ein leerer Stand echte Daten überschreibt)
    if (onlineRef.current === true) dirty.current = true; else offlineEdits.current = true;
    setData(updater);
  }

  // Laden + regelmäßiges Nachladen (ungespeicherte lokale Änderungen werden nicht überschrieben)
  useEffect(() => {
    let cancelled = false;
    async function load() {
      if (dirty.current) return;
      try {
        const res = await apiGetDoc(TPZ_DOC);
        if (cancelled || dirty.current) return;
        onlineRef.current = true;
        offlineEdits.current = false; // Speicher wieder erreichbar: der gespeicherte Stand gilt
        setOnline(true);
        setData(res.exists ? tpzNormalize(res.data) : tpzDefaultData());
      } catch (e) {
        console.error("TPZ laden fehlgeschlagen", e);
        if (cancelled) return;
        onlineRef.current = false;
        setOnline(false);
        setData((prev) => prev || tpzDefaultData()); // Testmodus: leere Planung, nur im Browser
      }
    }
    load();
    const interval = setInterval(load, SYNC_POLL_MS);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  // Speichern (debounced); beim Verlassen des Tabs wird ein noch offener Stand sofort gesichert
  useEffect(() => {
    if (!data || !dirty.current) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    const snapshot = data;
    saveTimer.current = setTimeout(() => {
      apiSetDoc(TPZ_DOC, snapshot)
        .then(() => { if (dataRef.current === snapshot) dirty.current = false; setSaveError(""); })
        .catch((e) => { console.error("TPZ speichern fehlgeschlagen", e); setSaveError("Speichern fehlgeschlagen – Änderungen sind noch nicht gesichert."); });
    }, 400);
  }, [data]);
  useEffect(() => () => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    if (dirty.current && dataRef.current) apiSetDoc(TPZ_DOC, dataRef.current).catch((e) => console.error("TPZ speichern fehlgeschlagen", e));
  }, []);

  /* ---------- Mutationen ---------- */

  function setStatus(pid, ds, status) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const person = { ...(availability[pid] || {}) };
      const entry = { ...(person[ds] || {}) };
      if (status === null) delete entry.status; else entry.status = status;
      if (tpzEntryIsEmpty(entry)) delete person[ds]; else person[ds] = entry;
      availability[pid] = person;
      return { ...prev, availability };
    });
  }

  function setWeekAvailable(pid, mondayStr) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const person = { ...(availability[pid] || {}) };
      weekFromMonday(mondayStr).forEach((ds) => { person[ds] = { ...(person[ds] || {}), status: "verfuegbar" }; });
      availability[pid] = person;
      return { ...prev, availability };
    });
  }

  function setNote(pid, ds, note) {
    commit((prev) => {
      const availability = { ...prev.availability };
      const person = { ...(availability[pid] || {}) };
      const entry = { ...(person[ds] || {}) };
      if (!note) delete entry.note; else entry.note = note;
      if (tpzEntryIsEmpty(entry)) delete person[ds]; else person[ds] = entry;
      availability[pid] = person;
      return { ...prev, availability };
    });
  }

  function handleAvailClick(pid, ds) {
    if (!pid) return;
    if (clickTimers.current[ds]) {
      clearTimeout(clickTimers.current[ds]);
      delete clickTimers.current[ds];
      return;
    }
    clickTimers.current[ds] = setTimeout(() => {
      delete clickTimers.current[ds];
      const cur = ((dataRef.current || {}).availability || {})[pid];
      const curStatus = cur && cur[ds] ? cur[ds].status : null;
      setStatus(pid, ds, curStatus === "verfuegbar" ? "vielleicht" : curStatus === "vielleicht" ? null : "verfuegbar");
    }, 260);
  }

  function handleAvailDoubleClick(pid, ds) {
    if (!pid) return;
    if (clickTimers.current[ds]) { clearTimeout(clickTimers.current[ds]); delete clickTimers.current[ds]; }
    setStatus(pid, ds, null);
  }

  function handleNoteClick(pid, ds) {
    if (!pid || !data) return;
    const cur = (data.availability[pid] || {})[ds];
    const input = window.prompt(`Kommentar für ${formatDateDe(ds)}.\nLeer lassen zum Entfernen.`, cur && cur.note ? cur.note : "");
    if (input === null) return;
    setNote(pid, ds, input.trim());
  }

  // Person für einen Tag (oder die ganze Woche) ein- bzw. austragen
  function toggleAssign(ds, pid, scope) {
    const dates = scope === "week" ? weekFromMonday(addDaysStr(ds, -dowMon0(ds))) : [ds];
    commit((prev) => {
      const adding = !((prev.plan[ds] || []).includes(pid));
      const plan = { ...prev.plan };
      dates.forEach((d) => {
        const list = (plan[d] || []).filter((x) => x !== pid);
        if (adding) list.push(pid);
        if (list.length) plan[d] = list; else delete plan[d];
      });
      return { ...prev, plan };
    });
  }

  function addMember(name) {
    const clean = name.trim();
    if (!clean) return false;
    if (data.members.some((m) => m.name.toLowerCase() === clean.toLowerCase())) { window.alert("Diesen Namen gibt es im TPZ-Team schon."); return false; }
    commit((prev) => {
      const used = prev.members.map((m) => m.color);
      const color = TPZ_COLORS.find((c) => !used.includes(c)) || TPZ_COLORS[prev.members.length % TPZ_COLORS.length];
      return { ...prev, members: [...prev.members, { id: "t_" + newId(), name: clean, color }] };
    });
    return true;
  }
  function renameMember(pid, name) {
    commit((prev) => ({ ...prev, members: prev.members.map((m) => (m.id === pid ? { ...m, name } : m)) }));
  }
  function recolorMember(pid, color) {
    commit((prev) => ({ ...prev, members: prev.members.map((m) => (m.id === pid ? { ...m, color } : m)) }));
  }
  function removeMember(pid) {
    commit((prev) => {
      const plan = {};
      Object.entries(prev.plan).forEach(([ds, list]) => { const l = list.filter((x) => x !== pid); if (l.length) plan[ds] = l; });
      const availability = { ...prev.availability };
      delete availability[pid];
      return { ...prev, members: prev.members.filter((m) => m.id !== pid), availability, plan };
    });
    if (currentPerson === pid) setCurrentPerson("");
  }

  function goPrevMonth() {
    if (viewMonth === 0) { setViewYear(viewYear - 1); setViewMonth(11); } else setViewMonth(viewMonth - 1);
  }
  function goNextMonth() {
    if (viewMonth === 11) { setViewYear(viewYear + 1); setViewMonth(0); } else setViewMonth(viewMonth + 1);
  }
  const weeks = useMemo(() => buildMonthGrid(viewYear, viewMonth), [viewYear, viewMonth]);

  if (!data) {
    return (<div className="tab-content"><p className="loading-text">TPZ lädt …</p></div>);
  }

  const nav = { viewYear, viewMonth, weeks, goPrevMonth, goNextMonth };
  return (
    <div className="tab-content">
      <div className="tpz-banner">
        <div className="tpz-banner-title">TPZ – Transplantationszentrum</div>
        <div className="tpz-banner-sub">Reine Dienstplanung (ganze Tage). Eigene Personenliste, getrennt vom Rufdienst.</div>
      </div>
      <div className="tpz-subnav">
        {[["plan", "Plan"], ["verfuegbar", "Verfügbarkeit"], ["admin", "Admin"], ["statistik", "Statistik"]].map(([key, label]) => (
          <button key={key} className={`tpz-subbtn ${section === key ? "active" : ""}`} onClick={() => setSection(key)}>{label}</button>
        ))}
      </div>
      {online === false && (
        <div className="tpz-error">
          <strong>Speicher nicht erreichbar.</strong> Die Verbindung zu „/api/doc“ fehlt (z. B. bei einer lokal geöffneten Datei oder einer Vorschau ohne Netlify-Funktionen). Die TPZ-Planung läuft im Testmodus: Eingaben werden <strong>nicht gespeichert</strong> und gehen beim Neuladen verloren. Auf der echten Netlify-Seite wird automatisch gespeichert.
        </div>
      )}
      {saveError && <div className="tpz-error">{saveError}</div>}

      {section === "plan" && <TpzPlanView data={data} {...nav} />}
      {section === "verfuegbar" && (
        <TpzAvailView
          data={data} {...nav}
          currentPerson={currentPerson} setCurrentPerson={setCurrentPerson}
          handleAvailClick={handleAvailClick} handleAvailDoubleClick={handleAvailDoubleClick}
          handleNoteClick={handleNoteClick} setWeekAvailable={setWeekAvailable}
        />
      )}
      {section === "admin" && (
        <TpzAdminView
          data={data} {...nav}
          toggleAssign={toggleAssign} addMember={addMember} renameMember={renameMember}
          recolorMember={recolorMember} removeMember={removeMember}
        />
      )}
      {section === "statistik" && <TpzStatsView data={data} statYear={statYear} setStatYear={setStatYear} />}
    </div>
  );
}

function tpzMember(data, id) { return data.members.find((m) => m.id === id); }
function tpzFirstName(data, m) { return shortMemberName(data.members, m); }

function TpzPlanView({ data, viewYear, viewMonth, weeks, goPrevMonth, goNextMonth }) {
  const today = todayStr();
  const holidays = useMemo(() => new Set([...shHolidays(viewYear - 1), ...shHolidays(viewYear), ...shHolidays(viewYear + 1)]), [viewYear]);
  const todaysIds = (data.plan[today] || []).filter((id) => tpzMember(data, id));
  const todaysNotes = todaysIds
    .map((id) => ({ id, note: ((data.availability[id] || {})[today] || {}).note }))
    .filter((x) => x.note);
  const { d } = parseDstr(today);

  return (
    <>
      <div className="tpz-today">
        <div className="today-date">{WEEKDAY_FULL[dowMon0(today)]}, {d}. {MONTH_NAMES[parseDstr(today).m]}</div>
        <div className="today-label">Heute im TPZ</div>
        {todaysIds.length ? (
          <div className="tpz-today-names">
            {todaysIds.map((id) => (<div key={id} className="tpz-today-name" style={{ color: tpzMember(data, id).color }}>{tpzMember(data, id).name}</div>))}
          </div>
        ) : (
          <div className="tpz-today-none">Niemand eingeplant</div>
        )}
        {todaysNotes.map((x) => (<div key={x.id} className="tpz-today-note">❗ {tpzMember(data, x.id).name}: {x.note}</div>))}
      </div>

      <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />
      <CalendarShell
        weeks={weeks}
        viewMonth={viewMonth}
        renderCell={(ds, inMonth) => {
          const ids = (data.plan[ds] || []).filter((id) => tpzMember(data, id));
          const isToday = ds === today;
          return (
            <div className={`cell cell-readonly ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""}`}>
              <span className="cell-daynum">{parseDstr(ds).d}</span>
              {isToday && <span className="today-tag">HEUTE</span>}
              {holidays.has(ds) && <span className="tpz-hol">Feiertag</span>}
              {ids.map((id) => {
                const m = tpzMember(data, id);
                return <span key={id} className="tpz-plan-name" style={{ color: m.color }}>{tpzFirstName(data, m)}</span>;
              })}
            </div>
          );
        }}
      />
      {data.members.length === 0 ? (
        <div className="tpz-empty">Noch niemand im TPZ-Team. Personen werden unter „Admin“ hinzugefügt.</div>
      ) : (
        <div className="legend-row">
          {data.members.map((m) => (
            <span key={m.id} className="legend-chip"><span className="legend-dot" style={{ background: m.color }}></span>{m.name}</span>
          ))}
        </div>
      )}
    </>
  );
}

function TpzAvailView({ data, viewYear, viewMonth, weeks, goPrevMonth, goNextMonth, currentPerson, setCurrentPerson, handleAvailClick, handleAvailDoubleClick, handleNoteClick, setWeekAvailable }) {
  const today = todayStr();
  const person = tpzMember(data, currentPerson);

  return (
    <>
      <div className="panel">
        <div className="person-picker">
          <label className="field-label">Ich bin</label>
          <select className="select" value={person ? currentPerson : ""} onChange={(e) => setCurrentPerson(e.target.value)}>
            <option value="">– Name wählen –</option>
            {data.members.map((m) => (<option key={m.id} value={m.id}>{m.name}</option>))}
          </select>
        </div>
      </div>

      {data.members.length === 0 ? (
        <div className="tpz-empty">Noch niemand im TPZ-Team. Personen werden unter „Admin“ hinzugefügt.</div>
      ) : !person ? (
        <p className="hint-text">Bitte wähle oben deinen Namen, um deine Verfügbarkeit für die TPZ-Planung einzutragen.</p>
      ) : (
        <>
          <p className="hint-text">
            Jeder Tag wird einzeln angeklickt: <strong>1. Klick</strong> = Verfügbar, <strong>2. Klick</strong> = Vielleicht, <strong>3. Klick</strong> = gelöscht. Doppelklick löscht sofort. Im Montagsfeld setzt der Button <strong>„Woche"</strong> die ganze Woche auf verfügbar. Über das „!"-Symbol kannst du zu einem Tag einen Kommentar hinterlegen.
          </p>
          <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />
          <CalendarShell
            weeks={weeks}
            viewMonth={viewMonth}
            renderCell={(ds, inMonth) => {
              const entry = (data.availability[person.id] || {})[ds];
              const status = entry ? entry.status : null;
              const note = entry ? entry.note : null;
              const isToday = ds === today;
              const planned = (data.plan[ds] || []).includes(person.id);
              return (
                <div
                  className={`cell ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""} status-${status || "none"} ${note ? "cell-notewarn" : ""} ${planned ? "cell-tpz-sched" : ""}`}
                  onClick={() => handleAvailClick(person.id, ds)}
                  onDoubleClick={() => handleAvailDoubleClick(person.id, ds)}
                >
                  <div className="cell-top">
                    <span className="cell-daynum">{parseDstr(ds).d}</span>
                    <span className="cell-top-buttons">
                      <button
                        className="note-btn"
                        onClick={(e) => { e.stopPropagation(); handleNoteClick(person.id, ds); }}
                        title="Kommentar angeben"
                      >
                        !
                      </button>
                    </span>
                  </div>
                  {dowMon0(ds) === 0 && (
                    <button
                      type="button"
                      className="week-btn"
                      title="Ganze Woche (Mo–So) als verfügbar markieren"
                      onClick={(e) => { e.stopPropagation(); setWeekAvailable(person.id, ds); }}
                    >
                      Woche
                    </button>
                  )}
                  {status && <span className="status-pill">{status === "verfuegbar" ? "Verfügbar" : "Vielleicht"}</span>}
                  {planned && <span className="tpz-sched-tag">📌 im Dienst</span>}
                  {note ? <span className="note-tag" title={note}>❗ {note}</span> : null}
                </div>
              );
            }}
          />
          <div className="legend-row">
            <span className="legend-chip"><span className="legend-dot legend-dot-verf"></span>Verfügbar</span>
            <span className="legend-chip"><span className="legend-dot legend-dot-viell"></span>Vielleicht</span>
            <span className="legend-chip">📌 im TPZ-Dienst eingeplant</span>
            <span className="legend-chip">❗ Kommentar</span>
          </div>
        </>
      )}
    </>
  );
}

function TpzAdminView({ data, viewYear, viewMonth, weeks, goPrevMonth, goNextMonth, toggleAssign, addMember, renameMember, recolorMember, removeMember }) {
  const today = todayStr();
  const [newName, setNewName] = useState("");
  const [nameDrafts, setNameDrafts] = useState({});
  const [weekDialog, setWeekDialog] = useState(null);
  const [manualDialog, setManualDialog] = useState(null);
  const [manualWholeWeek, setManualWholeWeek] = useState(false);

  function nameValue(m) { return nameDrafts[m.id] !== undefined ? nameDrafts[m.id] : m.name; }
  function commitName(m) {
    const val = (nameDrafts[m.id] !== undefined ? nameDrafts[m.id] : m.name).trim();
    if (val && val !== m.name) renameMember(m.id, val);
    setNameDrafts((d) => { const n = { ...d }; delete n[m.id]; return n; });
  }
  function askRemove(m) {
    if (window.confirm(`${m.name} aus dem TPZ-Team entfernen?\n\nAlle Verfügbarkeiten und eingeplanten TPZ-Dienste dieser Person werden gelöscht (auch in der Statistik). Der Rufdienst ist davon nicht betroffen.`)) removeMember(m.id);
  }
  function submitNew(e) {
    e.preventDefault();
    if (addMember(newName)) setNewName("");
  }

  function peopleForDay(ds) {
    const list = [];
    data.members.forEach((m) => {
      const e = tpzReported(data, m.id, ds);
      if (e) list.push({ member: m, status: e.status, note: e.note || null, manual: false });
    });
    (data.plan[ds] || []).forEach((pid) => {
      if (list.find((x) => x.member.id === pid)) return;
      const m = tpzMember(data, pid);
      if (m) list.push({ member: m, status: null, note: null, manual: true });
    });
    return list;
  }
  function manualCandidates(ds) {
    return data.members.filter((m) => !tpzReported(data, m.id, ds) && !(data.plan[ds] || []).includes(m.id));
  }

  function handleChipClick(ds, pid) {
    if (dowMon0(ds) === 0) setWeekDialog({ ds, pid });
    else toggleAssign(ds, pid, "day");
  }
  function confirmWeek(scope) {
    if (!weekDialog) return;
    toggleAssign(weekDialog.ds, weekDialog.pid, scope);
    setWeekDialog(null);
  }
  function openManual(ds) { setManualDialog(ds); setManualWholeWeek(false); }
  function closeManual() { setManualDialog(null); setManualWholeWeek(false); }
  function manualAdd(pid) {
    const scope = manualWholeWeek && dowMon0(manualDialog) === 0 ? "week" : "day";
    toggleAssign(manualDialog, pid, scope);
    closeManual();
  }

  // Kommentare des angezeigten Monats (auch für Handy, wo es kein Hover gibt)
  const monthPrefix = `${viewYear}-${pad(viewMonth + 1)}-`;
  const monthNotes = [];
  data.members.forEach((m) => {
    Object.entries(data.availability[m.id] || {}).forEach(([ds, e]) => {
      if (ds.startsWith(monthPrefix) && e.note) monthNotes.push({ ds, member: m, note: e.note });
    });
  });
  monthNotes.sort((a, b) => a.ds.localeCompare(b.ds) || a.member.name.localeCompare(b.member.name));

  const wdIsRemoval = weekDialog ? (data.plan[weekDialog.ds] || []).includes(weekDialog.pid) : false;
  const manualList = manualDialog ? manualCandidates(manualDialog) : [];
  const monthDuties = {};
  Object.entries(data.plan).forEach(([ds, list]) => {
    if (!ds.startsWith(monthPrefix)) return;
    list.forEach((pid) => { monthDuties[pid] = (monthDuties[pid] || 0) + 1; });
  });

  return (
    <>
      <div className="admin-iststand-panel">
        <h3 className="admin-iststand-title">TPZ-Dienste in {MONTH_NAMES[viewMonth]} {viewYear}</h3>
        {data.members.length === 0 ? (
          <div className="hint-text">Noch niemand im TPZ-Team – unten Personen hinzufügen.</div>
        ) : (
          <div className="admin-iststand-tiles">
            {data.members.map((m) => (
              <div key={m.id} className="admin-iststand-tile" style={{ borderColor: m.color }}>
                <div className="admin-iststand-tile-name" style={{ color: m.color }}>{m.name}</div>
                <div className="admin-iststand-tile-count">{monthDuties[m.id] || 0}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      <p className="hint-text">
        <strong>Klick</strong> auf einen Namen = für diesen Tag einplanen (ganzer Tag), nochmaliger Klick entfernt die Einplanung wieder. Pro Tag können mehrere Personen eingeplant werden. Am <strong>Montag</strong> öffnet sich zusätzlich die Frage „Für die ganze Woche planen?". Mit dem <strong>„+"</strong> in einem Tag lässt sich eine Person ohne gemeldete Verfügbarkeit manuell einplanen – sie ist dann mit <strong>„M"</strong> markiert.
      </p>

      <div className="legend-row">
        <span className="legend-chip"><span className="legend-dot legend-dot-verf"></span>Verfügbar</span>
        <span className="legend-chip"><span className="legend-dot legend-dot-viell"></span>Vielleicht</span>
        <span className="legend-chip"><span className="tpz-dot">✓</span> eingeplant</span>
        <span className="legend-chip"><span className="admin-manual-tag">M</span> manuell eingeplant</span>
        <span className="legend-chip">❗ Kommentar</span>
      </div>

      <MonthNav year={viewYear} month={viewMonth} onPrev={goPrevMonth} onNext={goNextMonth} />

      <CalendarShell
        weeks={weeks}
        viewMonth={viewMonth}
        renderCell={(ds, inMonth) => {
          const isMon = dowMon0(ds) === 0;
          const assigned = data.plan[ds] || [];
          const isToday = ds === today;
          const people = peopleForDay(ds);
          return (
            <div className={`cell cell-admin tpz-admin-cell ${inMonth ? "" : "cell-out"} ${isToday ? "cell-today" : ""} ${isMon ? "cell-admin-monday" : ""}`}>
              <div className="cell-top">
                <span className="cell-daynum">{parseDstr(ds).d}</span>
                <button type="button" className="admin-add-btn" title="Person manuell einplanen (ohne gemeldete Verfügbarkeit)" onClick={() => openManual(ds)}>+</button>
              </div>
              <div className="admin-chip-list">
                {people.length === 0 && <span className="admin-no-avail">–</span>}
                {people.map(({ member, status, note, manual }) => {
                  const isAssigned = assigned.includes(member.id);
                  return (
                    <button
                      key={member.id}
                      type="button"
                      className={`admin-mini-chip ${status ? "admin-mini-chip-" + status : ""} ${manual ? "admin-mini-chip-manual" : ""} ${isAssigned ? "tpz-assigned-chip" : ""}`}
                      style={isAssigned ? { borderColor: member.color } : {}}
                      onClick={(e) => { e.stopPropagation(); handleChipClick(ds, member.id); }}
                      title={`${member.name}${manual ? " – manuell eingeplant (keine Verfügbarkeit gemeldet)" : ""}${note ? " – Kommentar: " + note : ""}`}
                    >
                      {tpzFirstName(data, member)}
                      {isAssigned && <span className="tpz-dot">✓</span>}
                      {manual && <span className="admin-manual-tag">M</span>}
                      {note && <span className="admin-note-dot">❗</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }}
      />

      {monthNotes.length > 0 && (
        <div className="tpz-notes">
          <h3 className="tpz-notes-title">Kommentare im {MONTH_NAMES[viewMonth]}</h3>
          {monthNotes.map((n) => (
            <div key={n.ds + n.member.id} className="tpz-note-line">
              ❗ <b>{WEEKDAY_SHORT[dowMon0(n.ds)]} {formatDateDe(n.ds)}</b> · <span style={{ color: n.member.color, fontWeight: 600 }}>{n.member.name}</span>: {n.note}
            </div>
          ))}
        </div>
      )}

      <div className="people-manage-panel">
        <h3 className="admin-iststand-title" style={{ margin: 0 }}>TPZ-Team verwalten</h3>
        <form className="tpz-team-add" onSubmit={submitNew}>
          <input className="text-input" placeholder="Name der neuen Person" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <button type="submit" className="btn btn-primary">Hinzufügen</button>
        </form>
        <div className="people-manage-list">
          {data.members.map((m) => (
            <div className="people-manage-row" key={m.id}>
              <input type="color" className="people-color-input" value={m.color || "#8B8578"} onChange={(e) => recolorMember(m.id, e.target.value)} title="Farbe ändern" />
              <input
                className="text-input people-name-input"
                value={nameValue(m)}
                onChange={(e) => setNameDrafts((d) => ({ ...d, [m.id]: e.target.value }))}
                onBlur={() => commitName(m)}
                onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
              />
              <button type="button" className="mini-btn mat-delete" title="Aus dem TPZ-Team entfernen" onClick={() => askRemove(m)}>Entfernen</button>
            </div>
          ))}
        </div>
      </div>

      {weekDialog && (
        <div className="modal-backdrop" onClick={() => setWeekDialog(null)}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">{wdIsRemoval ? "Für die ganze Woche entfernen?" : "Für die ganze Woche planen?"}</h3>
            <p className="modal-text">
              {(tpzMember(data, weekDialog.pid) || {}).name} · Montag, {formatDateDe(weekDialog.ds)}
            </p>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={() => confirmWeek("day")}>Nur Montag</button>
              <button className="btn btn-primary" onClick={() => confirmWeek("week")}>Ganze Woche</button>
              <button className="btn btn-ghost" onClick={() => setWeekDialog(null)}>Abbrechen</button>
            </div>
          </div>
        </div>
      )}

      {manualDialog && (
        <div className="modal-backdrop" onClick={closeManual}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <h3 className="modal-title">Person manuell einplanen</h3>
            <p className="modal-text">
              {WEEKDAY_FULL[dowMon0(manualDialog)]}, {formatDateDe(manualDialog)} – Personen ohne gemeldete Verfügbarkeit
            </p>
            {dowMon0(manualDialog) === 0 && (
              <label className="modal-check">
                <input type="checkbox" checked={manualWholeWeek} onChange={(e) => setManualWholeWeek(e.target.checked)} />
                Für die ganze Woche
              </label>
            )}
            {manualList.length === 0 ? (
              <p className="hint-text">Alle Personen sind für diesen Tag bereits verfügbar oder eingeplant.</p>
            ) : (
              <div className="modal-list">
                {manualList.map((m) => (
                  <div className="modal-row" key={m.id}>
                    <span className="modal-row-name" style={{ color: m.color }}>{m.name}</span>
                    <button className="btn btn-ghost" onClick={() => manualAdd(m.id)}>Einplanen</button>
                  </div>
                ))}
              </div>
            )}
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={closeManual}>Schließen</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function TpzStatsView({ data, statYear, setStatYear }) {
  const thisYear = new Date().getFullYear();
  const years = useMemo(() => {
    const set = new Set([thisYear]);
    Object.keys(data.plan).forEach((ds) => set.add(Number(ds.slice(0, 4))));
    return Array.from(set).sort((a, b) => a - b);
  }, [data.plan]);
  const holidays = useMemo(() => shHolidays(statYear), [statYear]);

  const stats = {};
  data.members.forEach((m) => { stats[m.id] = { count: 0, weekend: 0, holiday: 0, months: new Array(12).fill(0) }; });
  Object.entries(data.plan).forEach(([ds, list]) => {
    if (ds.slice(0, 4) !== String(statYear)) return;
    list.forEach((pid) => {
      const s = stats[pid];
      if (!s) return;
      s.count++;
      s.months[parseDstr(ds).m]++;
      if (dowMon0(ds) >= 5) s.weekend++;
      if (holidays.has(ds)) s.holiday++;
    });
  });
  const total = Object.values(stats).reduce((sum, s) => sum + s.count, 0);

  return (
    <>
      <div className="panel">
        <label className="field-label">Jahr</label>
        <select className="select" value={statYear} onChange={(e) => setStatYear(Number(e.target.value))}>
          {(years.includes(statYear) ? years : [...years, statYear].sort((a, b) => a - b)).map((y) => (<option key={y} value={y}>{y}</option>))}
        </select>
      </div>

      <p className="hint-text">
        Gezählt werden alle im TPZ-Plan eingetragenen Diensttage (ganze Tage) des gewählten Jahres. „Wochenende" = Samstag/Sonntag, „Feiertage" = gesetzliche Feiertage in Schleswig-Holstein. Ein Feiertag auf einem Wochenende zählt in beiden Spalten.
      </p>

      {data.members.length === 0 ? (
        <div className="tpz-empty">Noch niemand im TPZ-Team.</div>
      ) : (
        <>
          <div className="stats-table-wrap">
            <table className="stats-table">
              <thead>
                <tr><th>Name</th><th>Diensttage {statYear}</th><th>davon Wochenende</th><th>davon Feiertage</th></tr>
              </thead>
              <tbody>
                {data.members.map((m) => (
                  <tr key={m.id}>
                    <td style={{ color: m.color }}>{m.name}</td>
                    <td className="stats-total-cell">{stats[m.id].count}</td>
                    <td>{stats[m.id].weekend || "–"}</td>
                    <td>{stats[m.id].holiday || "–"}</td>
                  </tr>
                ))}
                <tr>
                  <td><strong>Gesamt</strong></td>
                  <td className="stats-total-cell">{total}</td>
                  <td>{Object.values(stats).reduce((s, x) => s + x.weekend, 0) || "–"}</td>
                  <td>{Object.values(stats).reduce((s, x) => s + x.holiday, 0) || "–"}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="stats-table-wrap">
            <table className="stats-table tpz-month-table">
              <thead>
                <tr><th>Pro Monat</th>{MONTH_NAMES.map((mn) => (<th key={mn}>{mn.slice(0, 3)}</th>))}</tr>
              </thead>
              <tbody>
                {data.members.map((m) => (
                  <tr key={m.id}>
                    <td style={{ color: m.color }}>{m.name}</td>
                    {stats[m.id].months.map((c, i) => (<td key={i}>{c || "–"}</td>))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </>
  );
}

/* ---------- Tab: Alle (Gesamtübersicht: Rufdienst, TPZ-Dienst, Material) ----------
   Nur lesend. Rufdienst und Material kommen aus dem App-Datensatz, der TPZ-Dienst aus dem
   getrennten TPZ-Datensatz ("tpz/state"), der hier ausschließlich gelesen wird. */

const MATERIAL_CHECK_INTERVAL_DAYS = 30; // danach gilt die vollständige Materialkontrolle als überfällig

function AlleTab({ data }) {
  const [tpz, setTpz] = useState(null);
  const [tpzOk, setTpzOk] = useState(true);

  useEffect(() => {
    let cancelled = false;
    async function load() {
      try {
        const res = await apiGetDoc(TPZ_DOC);
        if (cancelled) return;
        setTpz(res.exists ? tpzNormalize(res.data) : tpzDefaultData());
        setTpzOk(true);
      } catch (e) {
        console.error("TPZ-Daten für die Übersicht nicht ladbar", e);
        if (!cancelled) setTpzOk(false);
      }
    }
    load();
    const interval = setInterval(load, SYNC_POLL_MS);
    return () => { cancelled = true; clearInterval(interval); };
  }, []);

  const today = todayStr();
  const { d } = parseDstr(today);

  /* Rufdienst */
  const primaryId = data.assignments[today];
  const backupId = (data.backupAssignments || {})[today];
  const primary = primaryId ? data.members.find((m) => m.id === primaryId) : null;
  const backup = backupId ? data.members.find((m) => m.id === backupId) : null;
  const primaryAvail = primaryId ? (data.availability[primaryId] || {})[today] : null;
  const telOf = (m) => (m && m.phone ? `tel:${m.phone.replace(/[^0-9+]/g, "")}` : null);

  /* TPZ */
  const tpzMembers = tpz ? tpz.members : [];
  const tpzNamesOn = (ds) => (tpz ? (tpz.plan[ds] || []).map((id) => tpzMembers.find((m) => m.id === id)).filter(Boolean) : []);
  const tpzToday = tpzNamesOn(today);

  /* nächste 7 Tage */
  const outlook = [];
  for (let i = 0; i < 7; i++) outlook.push(addDaysStr(today, i));

  /* Material */
  const rows = data.materials.map((m) => ({ mat: m, status: materialStatus(m) }));
  const toOrder = rows
    .filter((r) => r.status.understock)
    .sort((a, b) => a.mat.name.localeCompare(b.mat.name, "de"));
  const toCheck = [];
  data.materials.forEach((m) => {
    (m.batches || []).forEach((b) => {
      if (!b.expiry) return;
      const du = daysUntil(b.expiry);
      if (du <= EXPIRY_WARNING_DAYS) toCheck.push({ mat: m, batch: b, du });
    });
  });
  toCheck.sort((a, b) => a.du - b.du);

  const checks = [...(data.materialChecks || [])].sort((a, b) => b.date.localeCompare(a.date));
  const lastCheck = checks[0] || null;
  const daysSinceCheck = lastCheck ? -daysUntil(lastCheck.date) : null;
  const checkOverdue = !lastCheck || daysSinceCheck > MATERIAL_CHECK_INTERVAL_DAYS;

  function expiryText(du) {
    if (du < 0) return `abgelaufen seit ${-du} ${-du === 1 ? "Tag" : "Tagen"}`;
    if (du === 0) return "läuft heute ab";
    return `läuft in ${du} ${du === 1 ? "Tag" : "Tagen"} ab`;
  }

  return (
    <div className="tab-content">
      <div className="alle-grid">
        <div className="alle-card alle-card-rd">
          <div className="alle-label">Heute im Rufdienst</div>
          <div className="alle-date">{WEEKDAY_FULL[dowMon0(today)]}, {d}. {MONTH_NAMES[parseDstr(today).m]}</div>
          {primary ? (
            <>
              <div className="alle-name" style={{ color: colorFor(data.members, primary.id) }}>{primary.name}</div>
              {primaryAvail && primaryAvail.leadTimeHours ? <div className="today-leadwarn">⏱ Braucht {primaryAvail.leadTimeHours} Std. Vorlaufzeit</div> : null}
              {primaryAvail && primaryAvail.note ? <div className="today-notewarn">❗ {primaryAvail.note}</div> : null}
              {telOf(primary) ? (
                <a className="btn btn-call" href={telOf(primary)}><Phone size={16} /> Anrufen</a>
              ) : (
                <div className="no-phone-note">Keine Telefonnummer hinterlegt</div>
              )}
            </>
          ) : (
            <div className="alle-none">Niemand zugewiesen</div>
          )}
          {backup && (
            <div className="alle-sub">
              <span className="alle-sub-label">Backup:</span>{" "}
              <span style={{ color: colorFor(data.members, backup.id), fontWeight: 600 }}>{backup.name}</span>
              {telOf(backup) && <> · <a className="alle-tel" href={telOf(backup)}>anrufen</a></>}
            </div>
          )}
        </div>

        <div className="alle-card alle-card-tpz">
          <div className="alle-label">Heute im TPZ-Dienst</div>
          <div className="alle-date">{WEEKDAY_FULL[dowMon0(today)]}, {d}. {MONTH_NAMES[parseDstr(today).m]}</div>
          {tpz === null ? (
            <div className="alle-none">{tpzOk ? "lädt …" : "TPZ-Daten nicht erreichbar"}</div>
          ) : tpzToday.length ? (
            <div className="alle-names">
              {tpzToday.map((m) => (<div key={m.id} className="alle-name" style={{ color: m.color }}>{m.name}</div>))}
            </div>
          ) : (
            <div className="alle-none">Niemand eingeplant</div>
          )}
          {tpz !== null && !tpzOk && <div className="alle-sub">Stand evtl. nicht aktuell (keine Verbindung)</div>}
        </div>
      </div>

      <div className="alle-panel">
        <h3 className="alle-title">Nächste 7 Tage</h3>
        <div className="alle-week">
          <div className="alle-week-row alle-week-head"><span>Tag</span><span>Rufdienst</span><span>TPZ</span></div>
          {outlook.map((ds) => {
            const rid = data.assignments[ds];
            const rm = rid ? data.members.find((m) => m.id === rid) : null;
            const tz = tpzNamesOn(ds);
            const { d: dd, m: mm } = parseDstr(ds);
            return (
              <div key={ds} className={`alle-week-row ${ds === today ? "alle-week-today" : ""}`}>
                <span className="alle-week-day">{WEEKDAY_SHORT[dowMon0(ds)]} {dd}.{mm + 1}.</span>
                <span>{rm ? <b style={{ color: colorFor(data.members, rm.id) }}>{rm.name}</b> : <span className="alle-dash">–</span>}</span>
                <span>{tz.length ? tz.map((m, i) => (<span key={m.id}>{i > 0 ? ", " : ""}<b style={{ color: m.color }}>{m.name}</b></span>)) : <span className="alle-dash">–</span>}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="alle-panel">
        <h3 className="alle-title">Material bestellen {toOrder.length > 0 && <span className="alle-count alle-count-bad">{toOrder.length}</span>}</h3>
        {toOrder.length === 0 ? (
          <div className="alle-ok">✓ Nichts zu bestellen – alle Bestände über der Mindestmenge.</div>
        ) : (
          <div className="alle-list">
            {toOrder.map(({ mat, status }) => (
              <div key={mat.id} className="alle-item">
                <div className="alle-item-main">
                  <div className="alle-item-name">{mat.name}</div>
                  <div className="alle-item-sub">
                    {mat.refNr ? `Ref.: ${mat.refNr}` : "keine Ref.-Nr."}{mat.usage ? ` · ${USAGE_LABELS[mat.usage]}` : ""}
                  </div>
                </div>
                <div className="alle-item-qty">
                  <span className="mat-qty-badge mat-badge-bad">{status.total} / {mat.minQty} Stk.</span>
                  <span className="alle-missing">fehlt: {mat.minQty - status.total}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="alle-panel">
        <h3 className="alle-title">Material prüfen {toCheck.length > 0 && <span className="alle-count alle-count-warn">{toCheck.length}</span>}</h3>
        <div className={`alle-check ${checkOverdue ? "alle-check-overdue" : ""}`}>
          {lastCheck
            ? <>Letzte vollständige Kontrolle: {formatDateDe(lastCheck.date)}{lastCheck.personId ? ` (${memberName(data, lastCheck.personId)})` : ""} – vor {daysSinceCheck} {daysSinceCheck === 1 ? "Tag" : "Tagen"}{checkOverdue ? ` · überfällig (länger als ${MATERIAL_CHECK_INTERVAL_DAYS} Tage)` : ""}</>
            : <>Noch keine vollständige Materialkontrolle erfasst – überfällig</>}
        </div>
        {toCheck.length === 0 ? (
          <div className="alle-ok">✓ Keine abgelaufenen oder bald ablaufenden Chargen.</div>
        ) : (
          <div className="alle-list">
            {toCheck.map(({ mat, batch, du }) => (
              <div key={mat.id + batch.id} className="alle-item">
                <div className="alle-item-main">
                  <div className="alle-item-name">{mat.name}</div>
                  <div className="alle-item-sub">
                    MHD {formatDateDe(batch.expiry)} · {batch.qty} Stk.{batch.lot ? ` · Charge ${batch.lot}` : ""}
                  </div>
                </div>
                <div className="alle-item-qty">
                  <span className={`mat-qty-badge ${du < 0 ? "mat-badge-bad" : "mat-badge-warn"}`}>{expiryText(du)}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- gemeinsame Bausteine ---------- */

function NumberStepper({ value, onChange, min, placeholder, className, disabled }) {
  function step(delta) {
    if (disabled) return;
    const current = Number(value) || 0;
    let next = current + delta;
    if (min !== undefined && next < min) next = min;
    onChange(String(next));
  }
  return (
    <span className="number-stepper">
      <button type="button" className="stepper-btn" onClick={() => step(-1)} disabled={disabled} aria-label="verringern">−</button>
      <input
        type="number"
        inputMode="numeric"
        min={min}
        placeholder={placeholder}
        className={"text-input number-stepper-input " + (className || "")}
        value={value}
        disabled={disabled}
        onChange={(e) => onChange(e.target.value)}
        onFocus={(e) => e.target.select()}
      />
      <button type="button" className="stepper-btn" onClick={() => step(1)} disabled={disabled} aria-label="erhoehen">+</button>
    </span>
  );
}

  return (

      <button className="nav-btn" onClick={onNext}><ChevronRight size={18} /></button>
    </div>
  );
}

function CalendarShell({ weeks, viewMonth, renderCell }) {
  return (
    <div className="cal-grid">
      <div className="cal-week-row cal-header-row">
        {WEEKDAY_SHORT.map((w) => (<div key={w} className="cal-weekday">{w}</div>))}

      {weeks.map((week, wi) => (
        <div className="cal-week-row" key={wi}>
          {week.map((dateStr) => {
            const inMonth = parseDstr(dateStr).m === viewMonth;
            return <div className="cal-cell-wrap" key={dateStr}>{renderCell(dateStr, inMonth)}</div>;

function Legend() {
