/* ---------- Tab: Statistik ---------- */

function StatistikTab({ data, statYear, setStatYear, availableYears, stats, updateStatsBaseline }) {
  const [drafts, setDrafts] = useState({});

  function baselineFor(personId) {
    return (data.statsBaseline || {})[personId] || { count: 0, asOf: "" };
  }
  function draftCount(personId) {
    const key = personId + ":count";
    return drafts[key] !== undefined ? drafts[key] : String(baselineFor(personId).count || "");
  }
  function commitCount(personId) {
    const key = personId + ":count";
    const raw = drafts[key];
    if (raw === undefined) return;
    const num = Number(raw) || 0;
    updateStatsBaseline(personId, { count: num });
    setDrafts((d) => { const n = { ...d }; delete n[key]; return n; });
  }

  return (
    <div className="tab-content">
      <div className="panel">
        <label className="field-label">Jahr</label>
        <select className="select" value={statYear} onChange={(e) => setStatYear(Number(e.target.value))}>
          {availableYears.map((y) => (<option key={y} value={y}>{y}</option>))}
        </select>
      </div>

      <p className="hint-text">
        „Manueller Ist-Stand" addiert eine von euch eingetragene Anzahl bereits geleisteter Dienste (z. B. aus der Zeit vor dieser App) zur laufenden Zählung dazu und ergibt die Spalte „Gesamt". Das Datum „Stand vom" dient nur der Dokumentation.
      </p>

      <div className="stats-table-wrap">
        <table className="stats-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Diensttage {statYear}</th>
              <th>davon an Feiertagen</th>
              <th>Backup-Tage</th>
              <th>Manueller Ist-Stand</th>
              <th>Stand vom</th>
              <th>Gesamt</th>
            </tr>
          </thead>
          <tbody>
            {data.members.map((m) => {
              const s = stats[m.id] || { total: 0, holiday: 0, backup: 0 };
              const baseline = baselineFor(m.id);
              return (
                <tr key={m.id}>
                  <td style={{ color: colorFor(data.members, m.id) }}>{m.name}</td>
                  <td>{s.total}</td>
                  <td>{s.holiday > 0 ? `${s.holiday}` : "–"}</td>
                  <td>{s.backup > 0 ? `${s.backup}` : "–"}</td>
                  <td>
                    <input
                      type="number" min="0" className="text-input mat-num-input"
                      value={draftCount(m.id)}
                      onChange={(e) => setDrafts((d) => ({ ...d, [m.id + ":count"]: e.target.value }))}
                      onBlur={() => commitCount(m.id)}
                      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
                    />
                  </td>
                  <td>
                    <input
                      type="date" className="text-input stats-date-input"
                      value={baseline.asOf || ""}
                      onChange={(e) => updateStatsBaseline(m.id, { asOf: e.target.value })}
                    />
                  </td>
                  <td className="stats-total-cell">{s.total + (baseline.count || 0)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Tab: Material ---------- */

function MaterialTab({ data, materialImages, addBatch, consumeQty, deleteBatch, updateMinQty, addCustomMaterial, deleteMaterial, updateMaterialName, updateMaterialUsage, uploadMaterialImage, removeMaterialImage, exportMaterialPdf }) {
  const [expanded, setExpanded] = useState({});
  const [batchForm, setBatchForm] = useState(null);
  const [batchQty, setBatchQty] = useState("");
  const [batchExpiry, setBatchExpiry] = useState("");
  const [batchLot, setBatchLot] = useState("");
  const [consumeForm, setConsumeForm] = useState(null);
  const [consumeQtyInput, setConsumeQtyInput] = useState("");
  const [onlyWarnings, setOnlyWarnings] = useState(false);
  const [showAddMaterial, setShowAddMaterial] = useState(false);
  const [newName, setNewName] = useState("");
  const [newRef, setNewRef] = useState("");
  const [newMin, setNewMin] = useState("");
  const [nameEdit, setNameEdit] = useState(null);
  const [nameEditValue, setNameEditValue] = useState("");
  const [exporting, setExporting] = useState(false);

  const rows = useMemo(() => data.materials.map((m) => ({ mat: m, status: materialStatus(m) })), [data.materials]);

  const understockCount = rows.filter((r) => r.status.understock).length;
  const expiredCount = rows.filter((r) => r.status.expiryState === "expired").length;
  const soonCount = rows.filter((r) => r.status.expiryState === "soon").length;
  const hasWarnings = understockCount > 0 || expiredCount > 0 || soonCount > 0;

  const visibleRows = onlyWarnings
    ? rows.filter((r) => r.status.understock || r.status.expiryState !== "ok")
    : rows;

  function toggleExpand(id) { setExpanded((e) => ({ ...e, [id]: !e[id] })); }

  function openBatchForm(id) { setBatchForm(id); setBatchQty(""); setBatchExpiry(""); setBatchLot(""); setConsumeForm(null); }
  function submitBatchForm(id) {
    const qty = Number(batchQty);
    if (!qty || qty <= 0) return;
    addBatch(id, qty, batchExpiry || null, batchLot);
    setBatchForm(null);
  }

  function openConsumeForm(id) { setConsumeForm(id); setConsumeQtyInput(""); setBatchForm(null); }
  function submitConsumeForm(id) {
    const qty = Number(consumeQtyInput);
    if (!qty || qty <= 0) return;
    consumeQty(id, qty);
    setConsumeForm(null);
  }

  function submitNewMaterial() {
    if (!newName.trim()) return;
    addCustomMaterial(newName.trim(), newRef.trim(), Number(newMin) || 0);
    setNewName(""); setNewRef(""); setNewMin(""); setShowAddMaterial(false);
  }

  function startNameEdit(mat) { setNameEdit(mat.id); setNameEditValue(mat.name); }
  function submitNameEdit(id) {
    if (nameEditValue.trim()) updateMaterialName(id, nameEditValue.trim());
    setNameEdit(null);
  }

  async function handlePdfExport() {
    setExporting(true);
    try { await exportMaterialPdf(); } finally { setExporting(false); }
  }

  return (
    <div className="tab-content">
      <div className={`mat-summary ${hasWarnings ? "mat-summary-warn" : "mat-summary-ok"}`}>
        {hasWarnings ? (
          <span>
            {understockCount > 0 && <>⚠ {understockCount} Artikel unter Mindestmenge &nbsp; </>}
            {expiredCount > 0 && <>⏰ {expiredCount} Charge(n) abgelaufen &nbsp; </>}
            {soonCount > 0 && <>🕓 {soonCount} Charge(n) laufen bald ab</>}
          </span>
        ) : (
          <span>✓ Alle Bestände im grünen Bereich</span>
        )}
      </div>

      <div className="mat-controls">
        <label className="mat-filter-label">
          <input type="checkbox" checked={onlyWarnings} onChange={(e) => setOnlyWarnings(e.target.checked)} />
          Nur Warnungen anzeigen
        </label>
        <div className="mat-controls-right">
          <button className="btn btn-ghost" onClick={handlePdfExport} disabled={exporting}>
            <Download size={14} /> {exporting ? "Wird erstellt …" : "Bericht als PDF"}
          </button>
          <button className="btn btn-ghost" onClick={() => setShowAddMaterial((s) => !s)}>+ Neues Material</button>
        </div>
      </div>

      {showAddMaterial && (
        <div className="inline-form">
          <input className="text-input" placeholder="Artikelname" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <input className="text-input" placeholder="Ref.-Nummer (optional)" value={newRef} onChange={(e) => setNewRef(e.target.value)} />
          <input className="text-input mat-num-input" type="number" min="0" placeholder="Mindestmenge" value={newMin} onChange={(e) => setNewMin(e.target.value)} />
          <button className="btn btn-primary" onClick={submitNewMaterial}>Hinzufügen</button>
          <button className="btn btn-ghost" onClick={() => setShowAddMaterial(false)}>Abbrechen</button>
        </div>
      )}

      <div className="mat-list">
        {visibleRows.length === 0 && <p className="hint-text">Keine Artikel zu sehen.</p>}
        {visibleRows.map(({ mat, status }) => {
          const isExpanded = !!expanded[mat.id];
          const qtyBadgeClass = status.understock ? "mat-badge-bad" : "mat-badge-ok";
          const expiryBadgeClass = status.expiryState === "expired" ? "mat-badge-bad" : status.expiryState === "soon" ? "mat-badge-warn" : "";
          const image = materialImages ? materialImages[mat.id] : null;
          return (
            <div key={mat.id} className="mat-row">
              <div className="mat-row-main" onClick={() => toggleExpand(mat.id)}>
                {image ? <img src={image} alt="" className="mat-thumb" /> : <div className="mat-thumb mat-thumb-empty"><ImageIcon size={14} /></div>}
                <div className="mat-name-block">
                  <div className="mat-name">{mat.name}</div>
                  {mat.refNr ? <div className="mat-ref">Ref.: {mat.refNr}</div> : null}
                </div>
                {mat.usage ? <div className="mat-usage-badge">{USAGE_LABELS[mat.usage]}</div> : null}
                <div className={`mat-qty-badge ${qtyBadgeClass}`}>
                  {status.total}{mat.minQty > 0 ? ` / ${mat.minQty}` : ""} Stk.
                </div>
                <div className={`mat-expiry-badge ${expiryBadgeClass}`}>
                  {status.soonest ? `MHD ${status.soonest}` : "kein MHD hinterlegt"}
                </div>
              </div>

              {isExpanded && (
                <div className="mat-detail">
                  <div className="mat-editrow">
                    <div className="mat-image-edit">
                      {image ? <img src={image} alt="" className="mat-thumb-lg" /> : <div className="mat-thumb-lg mat-thumb-empty"><ImageIcon size={22} /></div>}
                      <div className="mat-image-actions">
                        <label className="btn btn-ghost mat-upload-label">
                          <ImageIcon size={13} /> Bild wählen
                          <input
                            type="file" accept="image/*" className="mat-file-input"
                            onChange={(e) => { if (e.target.files && e.target.files[0]) uploadMaterialImage(mat.id, e.target.files[0]); e.target.value = ""; }}
                          />
                        </label>
                        {image && <button className="mini-btn" onClick={() => removeMaterialImage(mat.id)}><Trash2 size={12} /></button>}
                      </div>
                    </div>

                    <div className="mat-name-edit-block">
                      {nameEdit === mat.id ? (
                        <div className="inline-form">
                          <input className="text-input" value={nameEditValue} onChange={(e) => setNameEditValue(e.target.value)} autoFocus />
                          <button className="btn btn-primary" onClick={() => submitNameEdit(mat.id)}>Speichern</button>
                          <button className="btn btn-ghost" onClick={() => setNameEdit(null)}>Abbrechen</button>
                        </div>
                      ) : (
                        <button className="mat-name-edit-btn" onClick={() => startNameEdit(mat)}>
                          <Pencil size={12} /> Namen ändern
                        </button>
                      )}
                      <div className="mat-usage-picker">
                        <span className="field-label">Verwendung:</span>
                        {["lunge", "herz", "beide"].map((u) => (
                          <button
                            key={u}
                            className={`usage-btn ${mat.usage === u ? "usage-btn-active" : ""}`}
                            onClick={() => updateMaterialUsage(mat.id, mat.usage === u ? null : u)}
                          >
                            {USAGE_LABELS[u]}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {mat.batches.length === 0 ? (
                    <p className="hint-text">Keine Chargen erfasst.</p>
                  ) : (
                    <table className="mat-batch-table">
                      <thead><tr><th>Menge</th><th>Verfallsdatum</th><th>Charge/LOT</th><th></th></tr></thead>
                      <tbody>
                        {mat.batches.map((b) => {
                          const du = b.expiry ? daysUntil(b.expiry) : null;
                          const cls = du !== null && du < 0 ? "mat-batch-expired" : du !== null && du <= EXPIRY_WARNING_DAYS ? "mat-batch-soon" : "";
                          return (
                            <tr key={b.id} className={cls}>
                              <td>{b.qty}</td>
                              <td>{b.expiry || "–"}</td>
                              <td>{b.lot || "–"}</td>
                              <td><button className="mini-btn" onClick={() => deleteBatch(mat.id, b.id)}>✕</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}

                  <div className="mat-actions">
                    <button className="btn btn-ghost" onClick={() => openBatchForm(mat.id)}>+ Charge</button>
                    <button className="btn btn-ghost" onClick={() => openConsumeForm(mat.id)}>− Verbrauch</button>
                    <span className="mat-min-edit">
                      Mindestmenge:
                      <input
                        type="number" min="0" className="text-input mat-num-input"
                        value={mat.minQty}
                        onChange={(e) => updateMinQty(mat.id, Number(e.target.value) || 0)}
                      />
                    </span>
                    <button
                      className="mini-btn mat-delete"
                      onClick={() => { if (window.confirm(`„${mat.name}" wirklich aus der Materialliste entfernen?`)) deleteMaterial(mat.id); }}
                    >
                      Artikel löschen
                    </button>
                  </div>

                  {batchForm === mat.id && (
                    <div className="inline-form">
                      <input className="text-input mat-num-input" type="number" min="1" placeholder="Menge" value={batchQty} onChange={(e) => setBatchQty(e.target.value)} />
                      <input className="text-input" type="date" value={batchExpiry} onChange={(e) => setBatchExpiry(e.target.value)} />
                      <input className="text-input" placeholder="LOT (optional)" value={batchLot} onChange={(e) => setBatchLot(e.target.value)} />
                      <button className="btn btn-primary" onClick={() => submitBatchForm(mat.id)}>Speichern</button>
                      <button className="btn btn-ghost" onClick={() => setBatchForm(null)}>Abbrechen</button>
                    </div>
                  )}
                  {consumeForm === mat.id && (
                    <div className="inline-form">
                      <input className="text-input mat-num-input" type="number" min="1" placeholder="Verbrauchte Menge" value={consumeQtyInput} onChange={(e) => setConsumeQtyInput(e.target.value)} />
                      <button className="btn btn-primary" onClick={() => submitConsumeForm(mat.id)}>Abbuchen</button>
                      <button className="btn btn-ghost" onClick={() => setConsumeForm(null)}>Abbrechen</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Tab: Im Einsatz ---------- */

function EinsatzTab({ data, einsatz, setEinsatzOrgan, setItemQty, markItemsPacked, markItemsConsumed, resetEinsatzChecklist }) {
  const [checked, setChecked] = useState({});
  const organ = einsatz.organ;

  function toggleChecked(materialId) {
    setChecked((c) => ({ ...c, [materialId]: !c[materialId] }));
  }

  const itemsForOrgan = organ ? data.materials.filter((m) => m.usage === organ || m.usage === "beide") : [];

  function renderMaterialRow(material) {
    const entry = einsatz.itemStatus[material.id] || {};
    const status = entry.status || "offen";
    const qty = entry.qty || 1;
    const stock = materialTotalQty(material);
    const isChecked = !!checked[material.id];
    return (
      <div key={material.id} className={`einsatz-item einsatz-item-${status}`}>
        <label className="einsatz-item-main">
          <input type="checkbox" checked={isChecked} onChange={() => toggleChecked(material.id)} disabled={status === "consumed"} />
          <span className="einsatz-item-label">{material.name}</span>
          {status === "packed" && <span className="einsatz-status-tag einsatz-status-packed">gepackt</span>}
          {status === "consumed" && <span className="einsatz-status-tag einsatz-status-consumed">verbraucht</span>}
        </label>
        <div className="einsatz-item-meta">
          <span className={`einsatz-linked ${stock <= 0 ? "einsatz-linked-empty" : ""}`}>Bestand: {stock}</span>
          <span className="field-label">Menge:</span>
          <input
            type="number" min="1" className="text-input mat-num-input einsatz-qty-input"
            value={qty}
            onChange={(e) => setItemQty(material.id, Math.max(1, Number(e.target.value) || 1))}
            disabled={status === "consumed"}
          />
        </div>
      </div>
    );
  }

  function selectedItemsData() {
    return itemsForOrgan
      .filter((m) => checked[m.id])
      .map((m) => {
        const entry = einsatz.itemStatus[m.id] || {};
        return { id: m.id, materialId: m.id, qty: entry.qty || 1 };
      });
  }

  const anyChecked = itemsForOrgan.some((m) => checked[m.id]);

  function handleMarkPacked() {
    const ids = itemsForOrgan.filter((m) => checked[m.id]).map((m) => m.id);
    markItemsPacked(ids);
    setChecked((c) => { const n = { ...c }; ids.forEach((id) => delete n[id]); return n; });
  }
  function handleMarkConsumed() {
    const items = selectedItemsData();
    markItemsConsumed(items);
    setChecked((c) => { const n = { ...c }; items.forEach((it) => delete n[it.id]); return n; });
  }

  const organLabel = organ === "lunge" ? "Lunge" : organ === "herz" ? "Herz" : "";

  return (
    <div className="tab-content">
      <div className="panel">
        <div>
          <label className="field-label">Einsatzart</label>
          <div className="organ-picker">
            <button className={`organ-btn ${organ === "lunge" ? "organ-btn-active" : ""}`} onClick={() => setEinsatzOrgan("lunge")}>Lunge</button>
            <button className={`organ-btn ${organ === "herz" ? "organ-btn-active" : ""}`} onClick={() => setEinsatzOrgan("herz")}>Herz</button>
          </div>
        </div>
      </div>

      {!organ ? (
        <p className="hint-text">Bitte oben Lunge oder Herz wählen, um die Materialliste zu sehen.</p>
      ) : itemsForOrgan.length === 0 ? (
        <p className="hint-text">
          Noch kein Material für „{organLabel}" hinterlegt. Im Material-Tab bei den einzelnen Artikeln die Verwendung „{organLabel}" oder „Beide" zuweisen.
        </p>
      ) : (
        <>
          <div className="einsatz-section">
            <h3 className="einsatz-section-title">Material für {organLabel}</h3>
            {itemsForOrgan.map((m) => renderMaterialRow(m))}
          </div>

          <div className="einsatz-actions">
            <button className="btn btn-ghost" onClick={handleMarkPacked} disabled={!anyChecked}>Ausgewählte als gepackt markieren</button>
            <button className="btn btn-primary" onClick={handleMarkConsumed} disabled={!anyChecked}>Ausgewählte als verbraucht markieren (Bestand abziehen)</button>
            <button className="btn btn-ghost" onClick={resetEinsatzChecklist}><RotateCcw size={14} /> Einsatz zurücksetzen</button>
          </div>
          <p className="hint-text">
            „Gepackt" merkt vor, was mitgenommen wurde – der Bestand ändert sich noch nicht. „Verbraucht" bucht die eingestellte Menge tatsächlich vom Material-Bestand ab. Welche Artikel hier erscheinen, legst du im Material-Tab über die Verwendung (Lunge/Herz/Beide) fest.
          </p>
        </>
      )}
    </div>
  );
}

/* ---------- gemeinsame Bausteine ---------- */

function MonthNav({ year, month, onPrev, onNext }) {
  return (
    <div className="month-nav">
      <button className="nav-btn" onClick={onPrev}><ChevronLeft size={18} /></button>
      <span className="month-label">{MONTH_NAMES[month]} {year}</span>
      <button className="nav-btn" onClick={onNext}><ChevronRight size={18} /></button>
    </div>
  );
}

function CalendarShell({ weeks, viewMonth, renderCell }) {
  return (
    <div className="cal-grid">
      <div className="cal-week-row cal-header-row">
        {WEEKDAY_SHORT.map((w) => (<div key={w} className="cal-weekday">{w}</div>))}
      </div>
      {weeks.map((week, wi) => (
        <div className="cal-week-row" key={wi}>
          {week.map((dateStr) => {
            const inMonth = parseDstr(dateStr).m === viewMonth;
            return <div className="cal-cell-wrap" key={dateStr}>{renderCell(dateStr, inMonth)}</div>;
          })}
        </div>
      ))}
    </div>
  );
}

function Legend() {
  return (
    <div className="legend-row">
      <span className="legend-chip"><span className="legend-dot legend-dot-verf"></span>Verfügbar</span>
      <span className="legend-chip"><span className="legend-dot legend-dot-viell"></span>Vielleicht</span>
      <span className="legend-chip">⏱ Vorlaufzeit nötig</span>
    </div>
  );
}

function Logo({ size = 40 }) {
  return (
    <span className="logo-emoji" style={{ fontSize: size * 0.62, lineHeight: 1 }}>
      🫀🫁
    </span>
  );
}

ReactDOM.createRoot(rootEl).render(<App />);
